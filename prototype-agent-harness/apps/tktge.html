<!doctype html>
<!-- PROTOTYPE — throwaway investor demo. A tkt.ge look-alike host app with the AgentPay agent built in via /sdk.js.
     Everything tkt.ge-specific (events, ticket picker, checkout, e-tickets) is "the client's app"; the agent + payments come from our API.
     TEST CASE: "Buy 3 tickets for movie The odyssey on 18 Oct in Cavea City Mall Saburtalo on 22:00 in central seats in any of the last three rows"
       → 3× The Odyssey, 18 Oct 22:00, Cavea City Mall Saburtalo, "Last rows 10–12, central seats" → app assigns 3 adjacent central seats (seat map + e-tickets).
     Georgian (first chip in ქარ mode): "იყიდე 3 ბილეთი ფილმზე „ოდისეა“ 18 ოქტომბერს, კავეა სითი მოლ საბურთალოში, 22:00-ზე, ცენტრალური ადგილები ბოლო სამი რიგიდან ერთ-ერთში" → same order.
     Older case: "Buy 2 tickets for the Dinamo Tbilisi match this Sunday, East Stand". -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>tkt.ge — AI tickets demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1B1D27; --ink2: #272A37; --muted: #6F7383; --faint: #A3A6B1; --line: #E9EAEB; --bg: #F4F4F5; --chip: #F2F3F6;
    --blue: #0F78FF; --blue-dark: #0C60CC; --blue-10: #E7F1FF; --sky: #009DF6; --pink: #FF005F; --navy: #2B2F59; --lav: #D4CDFD; --purple: #613C85;
    --green: #17B26A; --radius: 16px;
    font-family: Inter, "Noto Sans Georgian", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #e7e8ee; color: var(--ink); min-height: 100vh; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 24px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  img { display: block; }

  /* ---------- phone frame ---------- */
  .phone { width: 390px; height: 844px; border-radius: 54px; background: #111; padding: 11px; box-shadow: 0 30px 80px rgba(0,0,0,.25); flex-shrink: 0; position: relative; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: var(--bg); position: relative; display: flex; flex-direction: column; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #111; border-radius: 20px; z-index: 100; }
  .statusbar { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px 34px; font-weight: 700; font-size: 15px; flex-shrink: 0; z-index: 40; background: #fff; }
  .statusbar.dark { background: var(--navy); color: #fff; }
  .statusbar.dark svg * { fill: #fff; stroke: #fff; }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  @media (max-width: 520px) {
    body { padding: 0; background: #fff; display: block; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; }
    .island, .statusbar, .hood { display: none !important; }
    .chat { top: 0 !important; }
  }
  .view { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
  .view::-webkit-scrollbar { display: none; }
  .card { background: #fff; border-radius: 0 0 24px 24px; padding-bottom: 14px; }
  .panel { background: #fff; border-radius: 24px; margin-top: 10px; padding: 16px 0; }

  /* ---------- home ---------- */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 4px 16px 12px; }
  .topbar .logo svg { height: 26px; width: auto; display: block; }
  .loc { margin-left: auto; display: flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12.5px; color: var(--muted); max-width: 150px; }
  .loc span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lang { border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; font-size: 12px; font-weight: 700; }
  .search { margin: 0 16px 14px; display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--muted); font-size: 15px; width: calc(100% - 32px); text-align: left; }
  .search .ai { margin-left: auto; color: #fff; background: linear-gradient(90deg, var(--blue), var(--pink)); font-weight: 700; font-size: 12px; padding: 4px 9px; border-radius: 99px; }
  .catrows { overflow-x: auto; scrollbar-width: none; padding: 0 16px; }
  .catrows::-webkit-scrollbar { display: none; }
  .catrow { display: flex; gap: 8px; margin-bottom: 8px; width: max-content; }
  .catp { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .catp.on { background: var(--ink); color: #fff; }
  .catp .e { font-size: 18px; }
  .banner { margin: 14px 12px 0; border-radius: 18px; overflow: hidden; position: relative; height: 190px; display: block; width: calc(100% - 24px); text-align: left; background: #000; }
  .banner img { width: 100%; height: 100%; object-fit: cover; opacity: .75; }
  .banner .ov { position: absolute; inset: 0; padding: 18px; background: linear-gradient(90deg, rgba(10,12,30,.92) 0%, rgba(10,12,30,.4) 65%, transparent); color: #fff; display: flex; flex-direction: column; justify-content: center; }
  .banner .k { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: #FFD53D; text-transform: uppercase; }
  .banner h3 { font-size: 25px; font-weight: 900; line-height: 1.02; text-transform: uppercase; margin: 6px 0 8px; max-width: 230px; letter-spacing: -.3px; }
  .banner h3 em { font-style: normal; color: #FFD53D; font-size: 16px; display: block; margin: 2px 0; }
  .banner .d { font-weight: 800; font-size: 13px; }
  .dots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
  .dots i { width: 14px; height: 5px; border-radius: 3px; background: var(--line); }
  .dots i.on { background: var(--ink2); width: 22px; }
  .stories { display: flex; gap: 14px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
  .story { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 76px; flex-shrink: 0; font-size: 12px; font-weight: 500; text-align: center; }
  .story .ring { width: 72px; height: 72px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, #FF7A00, #FF005F); }
  .story .ring img, .story .ring div { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #fff; display: grid; place-items: center; font-size: 26px; }
  .story span { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sec { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px; }
  .sec h2 { font-size: 18px; font-weight: 800; letter-spacing: -.2px; }
  .sec .fire { color: var(--pink); }
  .sec a { margin-left: auto; color: var(--blue); font-weight: 600; font-size: 13.5px; }
  .carousel { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scrollbar-width: none; }
  .ecard { width: 220px; flex-shrink: 0; text-align: left; }
  .poster { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 4/5; background: #222; }
  .poster img { width: 100%; height: 100%; object-fit: cover; }
  .poster .ttl { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 12px 12px; background: linear-gradient(transparent, rgba(0,0,0,.82)); color: #fff; font-weight: 900; font-size: 17px; line-height: 1.1; text-transform: uppercase; letter-spacing: -.2px; }
  .poster .ttl small { display: block; font-size: 10.5px; font-weight: 700; color: #FFD53D; letter-spacing: .06em; margin-top: 4px; }
  .datebadge { position: absolute; left: 10px; top: 10px; width: 50px; padding: 6px 0; border-radius: 12px; background: rgba(27,29,39,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.18); color: #fff; text-align: center; line-height: 1.1; }
  .datebadge b { display: block; font-size: 18px; font-weight: 700; }
  .datebadge span { font-size: 11.5px; }
  .ename { font-weight: 700; font-size: 15px; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .esub { color: var(--muted); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eprice { font-weight: 700; font-size: 13.5px; margin-top: 4px; color: var(--ink); }
  .eprice span { color: var(--muted); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; padding: 0 16px 120px; }
  .grid .ecard { width: auto; min-width: 0; }
  .grid .poster .ttl { font-size: 13.5px; padding: 30px 9px 9px; }
  .grid .datebadge { width: 42px; left: 8px; top: 8px; }
  .grid .datebadge b { font-size: 15px; }
  .aistrip { margin: 0 16px; display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: linear-gradient(120deg, #2B2F59 0%, #613C85 70%, #FF005F 140%); color: #fff; width: calc(100% - 32px); text-align: left; }
  .aistrip .ic { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.14); display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
  .aistrip b { font-size: 15px; font-weight: 800; display: block; }
  .aistrip small { font-size: 12.5px; opacity: .85; }

  /* ---------- nav + fab ---------- */
  .nav { display: flex; justify-content: space-around; border-top: 1px solid var(--line); background: #fff; padding: 8px 0 22px; flex-shrink: 0; }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--faint); width: 70px; position: relative; }
  .nav button.on { color: var(--ink); }
  .nav svg { width: 24px; height: 24px; }
  .nav .badge { position: absolute; top: -3px; right: 16px; background: var(--pink); color: #fff; font-size: 10px; font-weight: 800; border-radius: 99px; min-width: 16px; height: 16px; display: grid; place-items: center; padding: 0 4px; }
  .fab { position: absolute; right: 16px; bottom: 96px; z-index: 20; background: var(--blue); color: #fff; border-radius: 99px; padding: 13px 18px 13px 15px; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px rgba(15,120,255,.42); }
  .fab.hide { display: none; }

  /* ---------- event ---------- */
  .ehero { position: relative; height: 300px; background: #111; }
  .ehero img { width: 100%; height: 100%; object-fit: cover; }
  .ehero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.25), transparent 30%, transparent 55%, rgba(0,0,0,.55)); }
  .ehero .btns { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 2; }
  .circle { width: 38px; height: 38px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .ebody { background: #fff; border-radius: 24px 24px 0 0; margin-top: -24px; position: relative; padding: 18px 16px 8px; }
  .kchip { display: inline-flex; align-items: center; gap: 5px; background: var(--blue-10); color: var(--blue); padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  .ebody h1 { font-size: 24px; font-weight: 800; letter-spacing: -.4px; line-height: 1.15; margin: 10px 0 4px; }
  .ebody .sub { color: var(--muted); font-size: 14px; }
  .info { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .info .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; flex-shrink: 0; color: var(--ink2); }
  .info b { font-size: 14.5px; font-weight: 700; display: block; }
  .info small { color: var(--muted); font-size: 12.5px; }
  .info .cal { text-align: center; line-height: 1; }
  .info .cal b { font-size: 16px; } .info .cal small { font-size: 10px; text-transform: uppercase; font-weight: 700; color: var(--pink); }
  .mapbox { margin: 14px 0 4px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
  .mapbox > svg { display: block; width: 100%; height: 140px; }
  .mapbox .cap svg { color: var(--pink); flex-shrink: 0; }
  .mapbox .cap { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
  .mapbox .cap a { margin-left: auto; color: var(--blue); font-weight: 700; }
  .about { color: var(--ink2); font-size: 14px; line-height: 1.5; padding: 10px 0 4px; }
  .h3 { font-size: 18px; font-weight: 800; margin: 18px 0 10px; }
  .tcat { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
  .tcat.on { border-color: var(--blue); background: #F7FAFF; }
  .tcat .t { flex: 1; min-width: 0; }
  .tcat b { font-size: 15px; font-weight: 700; display: block; }
  .tcat small { color: var(--muted); font-size: 12.5px; display: block; }
  .tcat .left { color: var(--pink); font-weight: 600; font-size: 11.5px; margin-top: 3px; }
  .tcat .pr { font-weight: 800; font-size: 15.5px; margin-bottom: 6px; text-align: right; }
  .qty { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  .qty button { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); font-size: 18px; font-weight: 600; display: grid; place-items: center; line-height: 1; }
  .qty button.plus { background: var(--blue); color: #fff; }
  .qty span { min-width: 12px; text-align: center; }
  .buybar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px 26px; display: flex; align-items: center; gap: 12px; }
  .buybar .s { font-size: 12.5px; color: var(--muted); }
  .buybar .s b { display: block; color: var(--ink); font-size: 18px; font-weight: 800; }
  .btn { background: var(--blue); color: #fff; border-radius: 12px; padding: 15px 16px; font-weight: 700; font-size: 16px; flex: 1; display: flex; justify-content: center; gap: 8px; }
  .btn:disabled { opacity: .45; }
  .btn.sec2 { background: var(--blue-10); color: var(--blue); }
  .btn.dark { background: var(--ink); }

  /* ---------- checkout ---------- */
  .pagehead { display: flex; align-items: center; gap: 12px; padding: 6px 16px 12px; position: sticky; top: 0; background: #fff; z-index: 5; border-bottom: 1px solid var(--line); }
  .pagehead h1 { font-size: 18px; font-weight: 800; }
  .pagehead .vsub { color: var(--muted); font-size: 12.5px; }
  .steps3 { display: flex; gap: 6px; padding: 12px 16px 0; }
  .steps3 i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
  .steps3 i.on { background: var(--blue); }
  .block { background: #fff; border-radius: 18px; margin: 10px 12px; padding: 14px; }
  .block h3 { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
  .mini { display: flex; gap: 12px; align-items: center; }
  .mini img { width: 58px; height: 72px; border-radius: 10px; object-fit: cover; }
  .mini b { font-size: 15px; font-weight: 800; display: block; line-height: 1.2; }
  .mini small { color: var(--muted); font-size: 12.5px; display: block; margin-top: 2px; }
  .line { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .line:last-child { border-bottom: 0; }
  .line .q { color: var(--blue); font-weight: 800; min-width: 24px; }
  .line .nm { flex: 1; font-weight: 600; font-size: 14px; }
  .line .mods { color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 2px; }
  .line .pr { font-weight: 700; font-size: 14px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14.5px; width: 100%; text-align: left; }
  .opt:last-child { border-bottom: 0; }
  .opt small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
  .sw { width: 42px; height: 26px; border-radius: 99px; background: var(--line); position: relative; flex-shrink: 0; margin-left: auto; transition: .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: .2s; }
  .opt.on .sw { background: var(--blue); }
  .opt.on .sw::after { left: 19px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 4px 0; font-weight: 600; font-size: 14.5px; }
  .row small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .row .chev { margin-left: auto; color: var(--faint); font-size: 20px; }
  .mc { width: 38px; height: 26px; border-radius: 5px; background: #1B1D27; position: relative; flex-shrink: 0; }
  .mc::before, .mc::after { content: ""; position: absolute; top: 6px; width: 14px; height: 14px; border-radius: 50%; }
  .mc::before { left: 7px; background: #EB001B; } .mc::after { left: 15px; background: #F79E1B; mix-blend-mode: screen; opacity: .95; }
  .sum { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; padding: 4px 0; }
  .sum.total { color: var(--ink); font-weight: 800; font-size: 17px; padding-top: 8px; }
  .terms { color: var(--muted); font-size: 11.5px; text-align: center; padding: 0 24px 10px; }

  /* ---------- tickets (confirmation) ---------- */
  .tkhead { background: var(--navy); color: #fff; padding: 6px 20px 70px; text-align: center; }
  .tkhead .ok { width: 54px; height: 54px; border-radius: 50%; background: var(--green); margin: 4px auto 10px; display: grid; place-items: center; }
  .tkhead h1 { font-size: 22px; font-weight: 800; }
  .tkhead p { opacity: .8; font-size: 13.5px; margin-top: 4px; }
  .tkhead .x { position: absolute; left: 14px; top: 6px; color: #fff; }
  .tickets { margin-top: -54px; padding: 0 18px 20px; display: flex; flex-direction: column; gap: 16px; }
  .tk { background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(27,29,39,.14); overflow: hidden; position: relative; }
  .tk .top { display: flex; gap: 12px; padding: 14px; }
  .tk .top > div { padding-right: 40px; }
  .tk .top img { width: 64px; height: 80px; border-radius: 10px; object-fit: cover; }
  .tk .top b { font-size: 16px; font-weight: 800; display: block; line-height: 1.2; }
  .tk .top small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .tk .grid2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 14px 14px; }
  .tk .grid2 div small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .tk .grid2 div b { font-size: 14px; font-weight: 700; }
  .tk .perf { position: relative; height: 0; border-top: 2px dashed var(--line); margin: 0 18px; }
  .tk .perf::before, .tk .perf::after { content: ""; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); }
  .tk .perf::before { left: -32px; } .tk .perf::after { right: -32px; }
  .tk .qr { padding: 16px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tk .qr svg { width: 150px; height: 150px; }
  .tk .qr code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .tk .of { position: absolute; right: 12px; top: 12px; background: var(--blue-10); color: var(--blue); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; }
  .wallet { background: #000; color: #fff; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; }
  .agentpaid { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 14px; padding: 12px 14px; font-weight: 600; font-size: 13px; color: var(--purple); border: 1px solid var(--lav); }
  .empty { text-align: center; color: var(--muted); padding: 60px 30px; font-size: 14px; }
  .empty div { font-size: 46px; margin-bottom: 10px; }
  .mylist { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .myt { background: #fff; border-radius: 16px; padding: 12px; display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; }
  .myt img { width: 56px; height: 70px; border-radius: 10px; object-fit: cover; }
  .myt b { font-size: 15px; font-weight: 800; display: block; }
  .myt small { display: block; color: var(--muted); font-size: 12.5px; }
  .myt .n { margin-left: auto; background: var(--blue-10); color: var(--blue); font-weight: 800; font-size: 12px; padding: 4px 9px; border-radius: 99px; white-space: nowrap; }

  /* ---------- cinema: sessions + seat map ---------- */
  .sess { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sess:last-child { border-bottom: 0; }
  .sess .vn { font-size: 13.5px; font-weight: 700; display: flex; gap: 6px; align-items: baseline; }
  .sess .vn small { color: var(--muted); font-weight: 500; font-size: 12px; }
  .times { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .tchip { border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13.5px; font-weight: 700; line-height: 1.1; text-align: center; }

// Pre-sold seats are deterministic per session; the app (tkt.ge's own seating engine) assigns the best adjacent

const hash = (str) => { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return h >>> 0; };

function pickSeats(it, qty, used) {
  const m = it.meta, [r0, r1] = m.rows, [s0, s1] = m.seats, mid = (m.hall.seats + 1) / 2, rmid = (r0 + r1) / 2;
  const free = (r, x) => !isTaken(m.eventId, r, x) && !used.has(`${r}-${x}`);
  const okZone = (x) => !m.side || x < 5 || x > 10;
  let best = null;
  for (let r = r0; r <= r1; r++) for (let x = s0; x + qty - 1 <= s1; x++) {
    const blk = Array.from({ length: qty }, (_, k) => x + k);
    if (!blk.every((y) => okZone(y) && free(r, y))) continue;
    const score = Math.abs(r - rmid) * 1.2 + Math.abs(x + (qty - 1) / 2 - mid);
    if (!best || score < best.score) best = { score, seats: blk.map((y) => ({ r, s: y })) };
  }
  if (best) return best.seats;
  const any = []; // no adjacent block: best single seats in the zone
  for (let r = r0; r <= r1 && any.length < qty; r++) for (let x = s0; x <= s1 && any.length < qty; x++) if (okZone(x) && free(r, x)) any.push({ r, s: x });
  return any;
}

    if (!it.meta.hall) return null;
    const seats = pickSeats(it, l.qty, used);

  // ---- phase A: availability + hold (before any money moves)
  await new Promise((done) => { bookRun = AgentPayUI.stages($("#bstA"), [
    { title: T.a0(cinema, VN), detail: `${VN} · ${cinema ? `${hname(it0)} · ` : ""}${p.lines.map((l) => zname(item(l.itemId))).join(", ")}`, ms: 1700 },
    { title: T.a1(cinema, what, n), detail: T.a1d(`${p.id.replace("pi_tktge_", "H-")}${"00" + n}`), ms: 1700 },
  ], { accent: "#0F78FF", onDone: done, onStage: (i) => {
    if (i === 0) { lbl(cinema ? T.scanning(zname(it0).toLowerCase()) : T.checking); document.querySelectorAll("#bmap .seat.zone").forEach((el) => el.classList.add("scan")); }
    if (i === 1) {
      document.querySelectorAll("#bmap .seat.scan").forEach((el) => el.classList.remove("scan"));
      seats.forEach((x, k) => setTimeout(() => { const el = seatEl(x); if (el) { el.className = "seat held"; el.textContent = x.s; } }, k * 260));
      let left = 600;
      lbl(T.heldFor(cinema ? what : T.a1(false, what, n)), "held", "10:00");
      holdTimer = setInterval(() => { left--; if ($("#holdt")) $("#holdt").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`; }, 1000);
    }
  } }); });
  if (S.screen !== "booking") return;

  // ---- payment: the user's Face ID → card network → capture
  const paid = await payWithFaceId(p);
  if (!paid) { clearInterval(holdTimer); toast(T.released); go("checkout"); return; }
  if (card) markCardPaid(card, paid);

  // ---- phase B: confirm in the venue system → issue → deliver
  const codes = Array.from({ length: n }, (_, k) => ticketCode(paid, k, e));
  bookRun = AgentPayUI.stages($("#bstB"), [
    { title: T.b0, detail: `${money(paid.total)} · ${paid.paymentMethod} · ${paid.id}`, ms: 1300 },
    { title: T.b1(cinema, VN), detail: T.b1d(what), ms: 2700 },
    { title: T.b2(n), detail: codes.join(" · "), ms: 2700 },
    { title: T.b3, detail: T.b3d(n), ms: 2100 },
    { title: T.b4(cinema), detail: cinema ? T.b4d(hname(it0), e.time) : `${VN}`, ms: 1100 },
  ], { accent: "#0F78FF", onDone: () => setTimeout(() => { if (S.screen === "booking") issueTickets(paid, viaAgent); }, 700), onStage: (i) => {
    if (i === 1) {
      clearInterval(holdTimer);
      lbl(T.confirming, "held", "");
      seats.forEach((x, k) => setTimeout(() => { const el = seatEl(x); if (el) el.className = "seat mine pop"; if (k === seats.length - 1) lbl(cinema ? T.soldTo(what) : T.soldShort, "ok", "✓"); }, 500 + k * 450));
      if (!seats.length) setTimeout(() => lbl(T.soldShort, "ok", "✓"), 900);
    }
    if (i === 2) {
      $("#bissued").style.display = "";
      const tix = paid.lines.flatMap((l, li) => Array.from({ length: l.qty }, (_, k) => ({ l, seat: seatsFor(paid)[li]?.[k] })));
      tix.forEach(({ l, seat }, k) => setTimeout(() => { const d = document.createElement("div"); d.className = "mtk";
        d.innerHTML = `${qrSvg(codes[k])}${seat ? `${T.row} ${seat.r} · ${T.seat} ${seat.s}` : esc(zname(item(l.itemId)))}<small>${codes[k]}</small>`; $("#bmini")?.appendChild(d);
        $("#bissued")?.scrollIntoView({ behavior: "smooth", block: "end" }); }, k * 600));
    }
    if (i === 3) { $("#bsent").innerHTML = `<div class="sentrow"><span>${T.mailSent}</span><span>${T.smsSent}</span><span class="w"> Wallet ×${n}</span></div>`; $("#view").scrollTop = 99999; }
  } });
}
function markCardPaid(card, paid) {
  card.classList.add("paid");
  card.querySelector(".acts").innerHTML = `<div class="paidrow">${t().paidRow(money(paid.total))}</div>`;
  const st = seatsFor(paid).flat().filter(Boolean), e = ev(item(paid.lines[0].itemId).meta.eventId);
  const b = document.createElement("div"); b.className = "b ai";
  b.textContent = t().done(paid.lines.reduce((s, l) => s + l.qty, 0), etitle(e), st.length ? seatText(st) : "");
  chatLog.push(b);
}

// ======================= e-tickets =======================
function issueTickets(p, viaAgent) {
  clearInterval(holdTimer);
  p.viaAgent = viaAgent;
  S.myTickets.push(p);
  S.order = { p, viaAgent };
  S.cart = { venueId: null, lines: [] };
  S.agentPayment = null;
  closeChat();
  go("tickets", { tab: "My tickets" });
}
function qrSvg(seed) {
  const N = 29; let h = 2166136261;
  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#1B1D27"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#1B1D27"/>`;
  const inF = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  let cells = "";
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (inF(x, y)) continue;
    const on = y === 6 || x === 6 ? (x + y) % 2 === 0 : rnd() < 0.5;
    if (on) cells += `M${x} ${y}h1v1h-1z`;
  }
  return `<svg viewBox="-2 -2 ${N + 4} ${N + 4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${N + 4}" height="${N + 4}" fill="#fff"/><path d="${cells}" fill="#1B1D27"/>${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg>`;
}
function ticketsView() {
  const { p, viaAgent } = S.order;
  const e = ev(item(p.lines[0].itemId).meta.eventId), v = venue(e.venueId);
  const seatMap = seatsFor(p);
  const tix = p.lines.flatMap((l, li) => Array.from({ length: l.qty }, (_, k) => ({ l, k, seat: seatMap[li]?.[k] })));
  const seatCols = (note, n) => { const sec = note.match(/Sectors? (\d+)–/), row = note.match(/Rows? (\d+)–/);
    if (sec) return [[ka() ? "სექტორი" : "Sector", +sec[1] + (n % 3)], [ka() ? "რიგი / ადგილი" : "Row / Seat", `${8 + (n >> 1)} / ${14 + n}`]];
    if (row) return [[t().row, +row[1] + 3], [t().seat, 11 + n]];
    return [[ka() ? "შესვლა" : "Entry", ka() ? "საერთო" : "General"], [ka() ? "კარიბჭე" : "Gate", ka() ? "მთავარი" : "Main"]]; };
  return `
  <div class="tkhead" style="position:relative"><button class="x" onclick="go('home',{tab:'Home'})">${I.close}</button>
    <div class="ok">${I.okc}</div><h1>${t().going}</h1><p>${esc(t().etCount(tix.length, money(p.total), p.paymentMethod))}</p></div>
  <div class="tickets">
    ${tix.map(({ l, k, seat }, n) => { const it = item(l.itemId); const cols = seat ? [[t().hall, (hname(it).match(/\d+/) || [hname(it)])[0]], [t().row, seat.r], [t().seat, seat.s]] : [[t().zone, zname(it)], ...seatCols(it.meta.note, n)]; const code = ticketCode(p, n, e);
      return `<div class="tk"><span class="of">${t().of(n + 1, tix.length)}</span>
      <div class="top"><img src="${poster(e.poster, 160, 200)}" alt=""><div><b>${esc(etitle(e))}</b><small>${when(e)}</small><small>${esc(ka() ? vnm(v) : v.meta?.fullName || v.name)}</small></div></div>
      <div class="grid2">${cols.map(([k, v]) => `<div><small>${k}</small><b>${esc(v)}</b></div>`).join("")}</div>${seat ? `<div style="padding:0 14px 12px;font-size:12px;color:var(--muted)">${esc(zname(it))}</div>` : ""}
      ${l.options.length ? `<div style="padding:0 14px 12px;font-size:12px;color:var(--muted)">+ ${esc(lopts(l).join(", "))}</div>` : ""}
      <div class="perf"></div>
      <div class="qr">${qrSvg(code)}<code>${code}</code></div></div>`; }).join("")}
    ${seatMap.some(Boolean) ? `<button class="btn sec2" onclick="openSeatMap('${p.lines[seatMap.findIndex(Boolean)].itemId}', seatsFor(S.order.p).flat().filter(Boolean))">${t().viewSeats}</button>` : ""}
    <button class="wallet">${I.apple} ${t().wallet}</button>
    ${viaAgent ? `<div class="agentpaid">${t().byAI}</div>` : ""}
    <div class="block" style="margin:0"><h3>${t().order} ${esc(p.id.replace("pi_tktge_", "#TKT-"))}</h3>
      ${p.lines.map((l) => `<div class="line"><span class="q">${l.qty}×</span><div class="nm">${esc(zname(item(l.itemId)))}${l.options.length ? `<div class="mods">${esc(lopts(l).join(", "))}</div>` : ""}</div><span class="pr">${money(l.qty * l.unitPrice)}</span></div>`).join("")}
      <div class="sum"><span>${t().service}</span><span>${money(p.serviceFee)}</span></div>
      <div class="sum total"><span>${t().paid}</span><span>${money(p.total)}</span></div>
    </div>
    <div style="height:10px"></div>
  </div>`;
}

// ======================= AI chat =======================
function openChat(prefill) {
  if (S.chatOpen) return;
  S.chatOpen = true;
  const c = document.createElement("div");
  c.className = "chat";
  c.id = "chat";
  c.innerHTML = `
    <div class="chathead"><button onclick="closeChat()">${I.back}</button><div class="ailogo">✦</div>
      <div style="min-width:0;flex:1"><b>tkt.ge AI</b><small><i></i>${t().sub(esc(locShort()))}</small></div>
      <div class="langsw"><button class="${LANG === "en" ? "on" : ""}" onclick="setLang('en')">EN</button><button class="${LANG === "ka" ? "on" : ""}" onclick="setLang('ka')">ქარ</button></div></div>
    <div class="msgs" id="msgs">
      <div class="welcome"><div class="ailogo">✦</div><h2>${t().title}</h2><p>${t().intro}</p>
        <div class="sugg">${t().chips.map((c) => `<button>${esc(c)}</button>`).join("")}</div></div>
    </div>
    <form class="composer" id="composer"><button type="button" class="mic" id="mic">${I.mic}</button><input id="q" placeholder="${esc(t().ph)}" autocomplete="off" /><button class="send">${I.send}</button></form>`;
  $("#screen").appendChild(c);
  c.querySelectorAll(".sugg button").forEach((b) => b.onclick = () => send(b.textContent));
  $("#composer").onsubmit = (e) => { e.preventDefault(); send($("#q").value); };
  setupMic();
  if (chatLog.length) { $(".welcome").remove(); chatLog.forEach((el) => $("#msgs").appendChild(el)); scrollChat(); }
  if (prefill) $("#q").value = prefill;
  setTimeout(() => $("#q")?.focus(), 250);
}
function closeChat() {
  const c = $("#chat");
  if (c) { chatLog = [...$("#msgs").children].filter((e) => !e.classList.contains("welcome")); c.remove(); }
  S.chatOpen = false;
}
let chatLog = [];
const scrollChat = () => { const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight; };
function bubble(cls, text) { const b = document.createElement("div"); b.className = "b " + cls; b.textContent = text; $("#msgs").appendChild(b); scrollChat(); return b; }

async function send(text) {
  text = text.trim();
  if (!text || S.busy) return;
  S.busy = true;
  if (/[\u10A0-\u10FF]/.test(text) !== ka()) { LANG = ka() ? "en" : "ka"; localStorage.setItem("agentpay_lang", LANG); AgentPayUI.lang = LANG;
    document.querySelectorAll(".langsw button").forEach((b, i) => b.classList.toggle("on", (i === 1) === ka())); $("#q").placeholder = t().ph; }
  $("#q").value = "";
  $(".welcome")?.remove();
  bubble("me", text);
  const tb = AgentPayUI.thinking($("#msgs"), { accent: "#0F78FF", onUpdate: scrollChat });
  const replyHolder = document.createElement("div");
  replyHolder.style.display = "contents";
  $("#msgs").appendChild(replyHolder);
  hoodClear(text);
  await agent.send(text, (e) => {
    hoodEvent(e);
    if (e.type === "status") tb.status(e.text);
    if (e.type === "thinking") tb.thought(e.text);
    if (e.type === "tool") tb.step(e.label, !e.result?.error);
    if (e.type === "payment") tb.settled().then(() => orderCard(e.payment));
    if (e.type === "reply" && e.text) tb.settled().then(() => { const b = document.createElement("div"); b.className = "b ai"; b.textContent = e.text; replyHolder.appendChild(b); scrollChat(); });
    if (e.type === "error") tb.settled().then(() => bubble("ai", "⚠ " + e.text));
    if (e.type === "done") tb.done();
  }).catch(() => { tb.done(); bubble("ai", t().conn); });
  await tb.settled();
  S.busy = false;
  refreshHood();
}

function orderCard(p) {
  // Mirror the agent's proposal into the app's own cart, so checkout shows it too.
  S.cart = { venueId: p.venue.id, lines: p.lines.map((l) => ({ itemId: l.itemId, qty: l.qty, optionIds: l.options.map((n) => item(l.itemId).options.find((o) => o.name === n).id) })) };
  S.agentPayment = p;
  S.cartSignature = sig();
  document.querySelectorAll(".ocard:not(.paid) .acts").forEach((a) => a.innerHTML = `<div class="note">${t().replaced}</div>`);

  const e = ev(item(p.lines[0].itemId).meta.eventId), v = venue(p.venue.id);
  const card = document.createElement("div");
  card.className = "ocard";
  card.innerHTML = `
    <div class="vh"><img src="${poster(e.poster, 160, 200)}" alt=""><div><b>${esc(etitle(e))}</b><small>${when(e)}</small><small>${esc(vnm(v))} · ${t().away(dist(v))}</small></div></div>
    <div class="ls">${p.lines.map((l, li) => { const it = item(l.itemId), seats = seatsFor(p)[li]; return `<div class="line" ${seats ? 'style="border:0"' : ""}><span class="q">${l.qty}×</span><div class="nm">${esc(zname(it))}<div class="mods">${esc(znote(it))}</div>${l.options.length ? `<div class="mods">+ ${esc(lopts(l).join(", "))}</div>` : ""}${l.note ? `<div class="mods">“${esc(l.note)}”</div>` : ""}</div><span class="pr">${money(l.qty * l.unitPrice)}</span></div>
      ${seats ? `<div class="seatpick">🪑 <b>${esc(seatText(seats))}</b><small>${seats.length === l.qty && new Set(seats.map((x) => x.r)).size === 1 ? t().pickAdj : t().pickAny} ${esc(zname(it).toLowerCase().replace(/,.*/, ""))}</small><button class="linkbtn" data-seat="${li}">${t().viewMap}</button></div>` : ""}`; }).join("")}</div>
    <div class="sums">
      <div class="sum"><span>${t().tickets}</span><span>${money(p.subtotal)}</span></div>
      <div class="sum"><span>${t().service}</span><span>${money(p.serviceFee)}</span></div>
      <div class="sum total"><span>${t().total}</span><span>${money(p.total)}</span></div>
    </div>
    <div class="pm"><span class="mc"></span>${esc(p.paymentMethod)}<span style="margin-left:auto;color:var(--blue)">${t().change}</span></div>
    <div class="acts">
      <button class="btn pay">${t().pay} ${money(p.total)}</button>
      <button class="btn sec2 edit">${t().review}</button>
      <div class="note">${t().safe}</div>
    </div>`;
  card.querySelector(".pay").onclick = (ev2) => { ev2.target.disabled = true; startBooking(p, true, card); };
  card.querySelector(".edit").onclick = () => { closeChat(); go("checkout"); };
  card.querySelectorAll("[data-seat]").forEach((b) => b.onclick = () => openSeatMap(p.lines[+b.dataset.seat].itemId, seatsFor(p)[+b.dataset.seat]));
  $("#msgs").appendChild(card);
  scrollChat();
}

function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("#mic");
  if (!SR) { mic.style.display = "none"; return; }
  let rec;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = ka() ? "ka-GE" : "en-US"; rec.interimResults = true;
    mic.classList.add("rec");
    rec.onresult = (e) => { $("#q").value = [...e.results].map((r) => r[0].transcript).join(""); };
    rec.onend = () => { mic.classList.remove("rec"); rec = null; if ($("#q").value.trim()) send($("#q").value); };
    rec.start();
  };
}

function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; $("#screen").appendChild(d); setTimeout(() => d.remove(), 3200); }

// ======================= under the hood =======================
function hoodClear(text) { $("#hood-trace").innerHTML = `<div class="ev st">${USER_ID} → <b>${esc(text)}</b></div>`; }
function hoodEvent(e) {
  const t = $("#hood-trace");
  const div = document.createElement("div");
  if (e.type === "status") { div.className = "ev st"; div.textContent = "⋯ agent: " + e.text; }
  else if (e.type === "thinking") { div.className = "ev st"; div.style.color = "#a9c7dc"; div.textContent = "💭 " + e.text; }
  else if (e.type === "tool") { div.className = "ev"; div.innerHTML = `<b>${esc(e.tool)}</b>(${esc(JSON.stringify(e.args))})\n→ ${esc(JSON.stringify(e.result).slice(0, 420))}`; }
  else if (e.type === "payment") { div.className = "ev pay"; div.innerHTML = `<b>payment intent</b> ${esc(e.payment.id)} · ${money(e.payment.total)} · <span class="s-awaiting">awaiting_user_confirmation</span>`; }
  else if (e.type === "reply") { div.className = "ev st"; div.textContent = "reply: " + e.text; }
  else if (e.type === "error") { div.className = "ev"; div.style.borderColor = "#f04"; div.textContent = "error: " + e.text; }
  else return;
  t.appendChild(div);
  t.parentElement.scrollTop = t.parentElement.scrollHeight;
}
async function refreshHood() {
  const s = await fetch("/debug/tktge").then((r) => r.json());
  $("#hood-agent").innerHTML = `${s.mode === "gemini" ? `Gemini <b style="color:#fff">${esc(s.model)}</b>` : `<b style="color:#ffc24b">MOCK</b> (no GEMINI_API_KEY)`} · function calling · per-tenant memory`;
  const u = Object.entries(s.memory);
  $("#hood-mem").innerHTML = u.length ? u.map(([id, m]) => `<div><b style="color:#fff">${esc(id)}</b> · ${m.history.length} messages<br>${m.preferences.map((p) => `<span class="tag">${esc(p)}</span>`).join("") || '<span style="color:#7a8a9a">no saved preferences</span>'}</div>`).join("") : '<span style="color:#7a8a9a">empty</span>';
  $("#hood-pay").innerHTML = s.payments.length ? s.payments.slice(-4).reverse().map((p) => `<div style="margin-bottom:6px">${esc(p.id)} · ${money(p.total)} · ${p.history.map((h) => `<span class="s-${h.status.split("_")[0]}">${h.status}</span><span style="color:#7a8a9a">(${h.by})</span>`).join(" → ")}</div>`).join("") : '<span style="color:#7a8a9a">none</span>';
}
$("#reset").onclick = async () => { await fetch("/debug/tktge/reset", { method: "POST" }); location.reload(); };
$("#hoodtoggle").onclick = () => { $("#hood").classList.toggle("off"); $("#hoodtoggle").textContent = $("#hood").classList.contains("off") ? "Show under the hood" : "Hide under the hood"; };

// ======================= boot =======================
(async () => {
  S.data = await fetch("/demo-data/tktge").then((r) => r.json());
  const byId = {};
  for (const i of S.data.catalog) {
    const m = i.meta;
    (byId[m.eventId] ||= { id: m.eventId, film: m.film, title: m.event, titleKa: m.eventKa, sub: m.sub, kind: m.kind, date: m.date, dow: m.dow, time: m.time, poster: m.poster, about: m.about, venueId: i.venueId, items: [] }).items.push(i);
  }
  S.events = Object.values(byId);
  AgentPayUI.lang = LANG;
  agent = AgentPay.init({ key: "pk_tktge_demo", userId: USER_ID, location: S.data.location });
  $("#fab").onclick = () => openChat();
  render();
  refreshHood();
  if (new URLSearchParams(location.search).has("clean")) { $("#hood").classList.add("off"); $("#hoodtoggle").textContent = "Show under the hood"; }
})();
</script>
