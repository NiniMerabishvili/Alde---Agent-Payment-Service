<!doctype html>
<!-- PROTOTYPE — throwaway investor demo. A myhome.ge (daily rent / hotels) look-alike host app with the AgentPay agent built in via /sdk.js.
     TEST CASE: "Book a Deluxe King room at the Biltmore this weekend with breakfast"
     Everything myhome-specific (listings, property page, booking) is "the client's app"; the agent + payments come from our API. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>myhome.ge — AI booking demo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green: #26b571; --green-dark: #1f9a5f; --green-08: rgba(38,181,113,.09); --green-16: rgba(38,181,113,.18);
    --blue: #1552f5; --orange: #fd541a; --text: #222; --muted: #646464; --faint: #909090; --line: rgba(0,0,0,.08);
    --surface: #f7f7f7; --radius: 14px;
    font-family: Inter, "Noto Sans Georgian", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #eef1f4; color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 24px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  img { display: block; }

  /* ---------- phone frame ---------- */
  .phone { width: 390px; height: 844px; border-radius: 54px; background: #111; padding: 11px; box-shadow: 0 30px 80px rgba(0,0,0,.25); flex-shrink: 0; position: relative; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #fff; position: relative; display: flex; flex-direction: column; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #111; border-radius: 20px; z-index: 100; }
  .statusbar { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px 34px; font-weight: 700; font-size: 15px; flex-shrink: 0; z-index: 40; background: #fff; }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  @media (max-width: 520px) {
    body { padding: 0; background: #fff; display: block; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; }
    .island, .statusbar, .hood { display: none !important; }
    .chat { top: 0 !important; }
  }
  .view { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
  .view::-webkit-scrollbar { display: none; }

  /* ---------- header ---------- */
  .hdr { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 12px; position: sticky; top: 0; background: #fff; z-index: 6; box-shadow: 0 1px 0 var(--line); }
  .hdr .r { display: flex; gap: 14px; align-items: center; }
  .hdr .acc { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--blue); color: var(--blue); display: grid; place-items: center; font-weight: 800; font-size: 13px; }

  /* ---------- home ---------- */
  .filters { margin: 14px 16px 12px; background: var(--surface); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  .fld { background: #fff; border-radius: 10px; padding: 9px 12px; font-size: 13.5px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 48px; text-align: left; }
  .fld > div { min-width: 0; }
  .fld b { display: block; color: var(--text); font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fld small { font-size: 11px; color: var(--faint); display: block; }
  .fld.wide { grid-column: span 2; justify-content: flex-start; }
  .fld .pin { color: var(--green); display: grid; }
  .row2 { display: flex; gap: 10px; margin: 0 16px 10px; }
  .outline { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-weight: 600; font-size: 14.5px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .outline .n { background: #111; color: #fff; border-radius: 50%; width: 19px; height: 19px; display: grid; place-items: center; font-size: 11px; }
  .sq { width: 46px; border: 1px solid var(--line); border-radius: 12px; display: grid; place-items: center; }
  .gbtn { background: var(--green); color: #fff; border-radius: 12px; padding: 14px; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
  .gbtn:disabled { opacity: .55; }
  .aiwrap { margin: 0 16px 18px; }
  .aibanner { margin-top: 12px; width: 100%; border-radius: 16px; padding: 14px; text-align: left; display: flex; gap: 12px; align-items: center; background: linear-gradient(120deg, #e9f8f1 0%, #eef3ff 100%); border: 1px solid var(--green-16); }
  .aibanner .sp { width: 44px; height: 44px; border-radius: 14px; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
  .aibanner b { font-size: 15px; font-weight: 700; display: block; }
  .aibanner span { font-size: 12.5px; color: var(--muted); line-height: 1.35; display: block; margin-top: 2px; }
  .aibanner .go { margin-left: auto; color: var(--green); font-weight: 700; font-size: 20px; }
  .tiles { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 22px; scrollbar-width: none; }
  .tile { width: 78px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 600; text-align: center; line-height: 1.3; }
  .tile .ic { width: 74px; height: 56px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; color: var(--blue); }
  .sec { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 12px; }
  .sec h2 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; text-transform: none; }
  .sec .arrows { display: flex; gap: 6px; }
  .sec .arrows span { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--muted); }
  .sec a { color: var(--blue); font-weight: 600; font-size: 13.5px; }
  .carousel { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 24px; scrollbar-width: none; }
  .card { width: 300px; flex-shrink: 0; text-align: left; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; display: block; }
  .list { padding: 0 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  .list .card { width: 100%; }
  .cimg { position: relative; aspect-ratio: 16/10; background: var(--surface); }
  .cimg img { width: 100%; height: 100%; object-fit: cover; }
  .badge { position: absolute; left: 10px; top: 10px; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; color: #fff; background: var(--orange); }
  .badge.v { background: var(--blue); }
  .badge.vp { background: #7b3ff2; }
  .heart { position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; color: #222; }
  .dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.55); }
  .dots i:first-child { background: #fff; }
  .cbody { padding: 12px 14px 12px; }
  .pr { display: flex; align-items: center; gap: 8px; }
  .pr b { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .pr .pn { color: var(--muted); font-size: 13px; font-weight: 500; }
  .cur { display: inline-flex; background: var(--surface); border-radius: 99px; padding: 2px; font-size: 11px; font-weight: 700; }
  .cur span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .cur span.on { background: var(--green); color: #fff; }
  .ctitle { font-size: 14px; font-weight: 600; margin-top: 6px; line-height: 1.35; }
  .specs { display: flex; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--text); align-items: center; flex-wrap: wrap; }
  .specs span { display: flex; align-items: center; gap: 5px; }
  .specs svg { color: #444; }
  .cfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12.5px; }
  .cfoot .loc { color: var(--blue); display: flex; gap: 4px; align-items: center; }
  .cfoot .dt { color: var(--faint); }
  .stars { color: #f5a623; font-size: 12px; letter-spacing: 1px; }

  /* ---------- bottom nav + fab ---------- */
  .nav { display: flex; justify-content: space-around; border-top: 1px solid var(--line); background: #fff; padding: 8px 0 22px; flex-shrink: 0; }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--faint); width: 70px; }
  .nav button.on { color: var(--green); }
  .nav svg { width: 23px; height: 23px; }
  .nav .add { width: 44px; height: 44px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; margin-top: -4px; }
  .fab { position: absolute; right: 16px; bottom: 96px; z-index: 20; background: var(--green); color: #fff; border-radius: 99px; padding: 13px 18px 13px 15px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px rgba(38,181,113,.45); }
  .fab.hide { display: none; }

  /* ---------- property ---------- */
  .gal { position: relative; height: 250px; background: #ddd; }
  .gal .strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 100%; scrollbar-width: none; }
  .gal .strip img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; scroll-snap-align: start; }
  .gal .btns { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; }
  .circle { width: 38px; height: 38px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .gal .cnt { position: absolute; right: 12px; bottom: 12px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 99px; display: flex; gap: 5px; align-items: center; }
  .phead { padding: 16px 16px 6px; }
  .phead .meta { display: flex; gap: 10px; align-items: center; color: var(--faint); font-size: 12px; margin-bottom: 8px; }
  .phead .meta .id { background: var(--surface); padding: 3px 8px; border-radius: 6px; }
  .phead h1 { font-size: 20px; font-weight: 700; line-height: 1.3; }
  .phead .addr { color: var(--blue); font-size: 13.5px; margin-top: 6px; display: flex; gap: 5px; align-items: center; }
  .pbox { margin: 12px 16px; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .pbox .pr b { font-size: 24px; }
  .pbox .rate { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .score { background: var(--green); color: #fff; font-weight: 700; border-radius: 8px 8px 8px 2px; padding: 3px 7px; font-size: 13px; }
  .bigspecs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 16px 6px; }
  .bigspecs div { background: var(--surface); border-radius: 12px; padding: 10px 6px; text-align: center; font-size: 11.5px; color: var(--muted); }
  .bigspecs div b { display: block; color: var(--text); font-size: 14px; margin-top: 4px; font-weight: 700; }
  .ps { padding: 18px 16px 4px; }
  .ps h3 { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
  .ps p { font-size: 14px; color: #444; line-height: 1.5; }
  .datesel { display: flex; gap: 8px; margin-bottom: 12px; }
  .datesel div { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 11.5px; color: var(--faint); }
  .datesel div b { display: block; color: var(--text); font-size: 13.5px; font-weight: 600; }
  .datesel div.on { border-color: var(--green); background: var(--green-08); }
  .room { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px; display: flex; text-align: left; width: 100%; }
  .room img { width: 104px; object-fit: cover; flex-shrink: 0; }
  .room .t { padding: 10px 12px; flex: 1; min-width: 0; }
  .room .t b { font-size: 14.5px; font-weight: 700; display: block; }
  .room .t .rs { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .room .t .rp { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; }
  .room .t .rp b { font-size: 16px; }
  .room .t .rp small { display: block; font-size: 11.5px; color: var(--faint); }
  .room .sel { background: var(--green); color: #fff; border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .amen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .amen span { display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
  .amen i { width: 28px; height: 28px; border-radius: 8px; background: var(--surface); display: grid; place-items: center; font-style: normal; font-size: 14px; }
  .mapbox { border-radius: 14px; overflow: hidden; height: 170px; position: relative; border: 1px solid var(--line); }
  .mapbox .lbl { position: absolute; left: 10px; bottom: 10px; background: #fff; border-radius: 10px; padding: 7px 10px; font-size: 12.5px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .host { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .host .av { width: 44px; height: 44px; border-radius: 50%; background: var(--green-08); color: var(--green); display: grid; place-items: center; font-weight: 800; }
  .host b { font-size: 14.5px; display: block; }
  .host small { color: var(--muted); font-size: 12px; }
  .host .call { white-space: nowrap; margin-left: auto; background: var(--green-08); color: var(--green-dark); padding: 9px 12px; border-radius: 10px; font-weight: 600; font-size: 13px; }

  .bookbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px 26px; display: flex; align-items: center; gap: 12px; }
  .bookbar .t { flex: 1; font-size: 12px; color: var(--muted); }
  .bookbar .t b { display: block; font-size: 17px; color: var(--text); }
  .bookbar .gbtn { width: auto; padding: 13px 22px; }

  /* ---------- sheets ---------- */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 60; display: flex; align-items: flex-end; animation: fade .2s; }
  .sheet { background: #fff; width: 100%; border-radius: 20px 20px 0 0; max-height: 92%; display: flex; flex-direction: column; animation: up .25s ease-out; }
  .sheet .body { overflow-y: auto; flex: 1; scrollbar-width: none; }
  @keyframes up { from { transform: translateY(40%); opacity: .4; } }
  @keyframes fade { from { opacity: 0; } }
  .itemimg { width: 100%; height: 200px; object-fit: cover; border-radius: 20px 20px 0 0; }
  .ihead { padding: 16px; }
  .ihead h2 { font-size: 20px; font-weight: 700; }
  .ihead p { color: var(--muted); font-size: 13.5px; margin-top: 6px; line-height: 1.45; }
  .og { padding: 4px 16px 10px; }
  .og h4 { font-size: 15px; font-weight: 700; margin: 8px 0 2px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 500; font-size: 14.5px; width: 100%; text-align: left; }
  .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #c4c4c4; display: grid; place-items: center; flex-shrink: 0; }
  .opt.on .box { background: var(--green); border-color: var(--green); }
  .opt.on .box::after { content: ""; width: 10px; height: 6px; border: 2.5px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
  .opt .x { margin-left: auto; color: var(--muted); font-size: 13.5px; }
  .sheetfoot { display: flex; gap: 12px; padding: 12px 16px 26px; border-top: 1px solid var(--line); }

  /* ---------- booking ---------- */
  .pagehead { display: flex; align-items: center; gap: 12px; padding: 8px 16px 12px; position: sticky; top: 0; background: #fff; z-index: 5; border-bottom: 1px solid var(--line); }
  .pagehead h1 { font-size: 18px; font-weight: 700; }
  .pagehead .vsub { font-size: 12.5px; color: var(--muted); }
  .steps3 { display: flex; gap: 6px; padding: 12px 16px 4px; }
  .steps3 i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
  .steps3 i.on { background: var(--green); }
  .block { padding: 14px 16px 6px; }
  .block h3 { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .pcard { display: flex; gap: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .pcard img { width: 84px; height: 66px; border-radius: 10px; object-fit: cover; }
  .pcard b { font-size: 14.5px; display: block; }
  .pcard small { color: var(--muted); font-size: 12.5px; display: block; margin-top: 2px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kv div { background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 11.5px; color: var(--faint); }
  .kv div b { display: block; color: var(--text); font-size: 13.5px; font-weight: 600; margin-top: 2px; }
  .inp { display: block; border: 1px solid #ddd; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
  .inp small { display: block; font-size: 11px; color: var(--faint); }
  .inp input, .inp textarea { border: 0; outline: 0; width: 100%; font-size: 14.5px; font-weight: 500; background: transparent; resize: none; }
  .line { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .line img { width: 56px; height: 44px; border-radius: 8px; object-fit: cover; }
  .line .q { color: var(--green); font-weight: 800; min-width: 22px; }
  .line .nm { flex: 1; font-weight: 600; font-size: 14px; }
  .line .mods { color: var(--muted); font-size: 12.5px; font-weight: 500; margin-top: 2px; }
  .line .mods.g { color: var(--green-dark); font-weight: 600; }
  .line .lp { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .sum { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; padding: 4px 0; }
  .sum.total { color: var(--text); font-weight: 700; font-size: 17px; padding-top: 8px; }
  .payrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-weight: 600; font-size: 14px; }
  .payrow small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .payrow .chev { margin-left: auto; color: var(--faint); }
  .visa { background: #1a1f71; color: #fff; font-weight: 900; font-style: italic; font-size: 11px; padding: 3px 6px; border-radius: 4px; }
  .policy { font-size: 12px; color: var(--muted); line-height: 1.45; background: var(--green-08); border-radius: 12px; padding: 10px 12px; }

  /* ---------- confirmation ---------- */
  .conf { padding: 26px 16px 30px; }
  .conf .ok { width: 74px; height: 74px; border-radius: 50%; background: var(--green); margin: 0 auto 14px; display: grid; place-items: center; animation: pop .4s ease-out; }
  .conf .ok svg { width: 44px; height: 44px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .conf h1 { text-align: center; font-size: 22px; font-weight: 700; }
  .conf .sub { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; }
  .resno { margin: 18px 0 14px; border: 1.5px dashed var(--green); border-radius: 14px; padding: 12px; text-align: center; background: var(--green-08); }
  .resno small { color: var(--muted); font-size: 12px; display: block; }
  .resno b { font-size: 22px; letter-spacing: 1px; font-weight: 800; color: var(--green-dark); }
  .agentpaid { display: flex; gap: 10px; align-items: center; background: #eef3ff; border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 13px; color: var(--blue); margin: 12px 0; }

  /* ---------- fulfilment ---------- */
  .fhero { position: relative; height: 190px; }
  .fhero img { width: 100%; height: 100%; object-fit: cover; }
  .fshade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,.05) 35%, rgba(0,0,0,.7) 100%); }
  .ftop { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; }
  .fpms { background: rgba(255,255,255,.92); border-radius: 99px; padding: 6px 10px; font-size: 11.5px; font-weight: 600; }
  .fhd { position: absolute; left: 16px; right: 16px; bottom: 14px; color: #fff; }
  .fhd .big { font-size: 23px; font-weight: 800; letter-spacing: -.3px; }
  .fhd #fsub { font-size: 13.5px; opacity: .9; margin-top: 2px; }
  .fbody { padding: 0 16px 40px; margin-top: -10px; position: relative; }
  .keycard { background: linear-gradient(135deg, #1d2a24 0%, #0f1714 100%); color: #fff; border-radius: 18px; padding: 14px 16px; box-shadow: 0 10px 28px rgba(0,0,0,.25); position: relative; overflow: hidden; transition: box-shadow .4s; }
  .keycard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.12) 50%, transparent 70%); background-size: 250% 100%; animation: sheen 2.2s linear infinite; }
  .keycard.ok::after { animation: none; opacity: 0; }
  .keycard.ok { box-shadow: 0 10px 28px rgba(38,181,113,.4); }
  @keyframes sheen { from { background-position: 150% 0; } to { background-position: -100% 0; } }

  $("#screen").appendChild(c);

function closeChat() {
  const c = $("#chat");
  if (c) { chatLog = [...$("#msgs").children].filter((e) => !e.classList.contains("welcome")); c.remove(); }
  S.chatOpen = false;
}
let chatLog = [];
const scrollChat = () => { const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight; };
function bubble(cls, text) { const b = document.createElement("div"); b.className = "b " + cls; b.textContent = text; $("#msgs").appendChild(b); scrollChat(); return b; }

async function send(text) {
  text = text.trim();
  if (!text || S.busy) return;
  S.busy = true;
  if (/[Ⴀ-ჿ]/.test(text) !== ka()) { LANG = ka() ? "en" : "ka"; localStorage.setItem("agentpay_lang", LANG); AgentPayUI.lang = LANG; }
  $("#q").value = "";
  $(".welcome")?.remove();
  bubble("me", text);
  const tb = AgentPayUI.thinking($("#msgs"), { accent: "#26b571", onUpdate: scrollChat });
  const replyHolder = document.createElement("div");
  replyHolder.style.display = "contents";
  $("#msgs").appendChild(replyHolder);
  hoodClear(text);
  await agent.send(text, (e) => {
    hoodEvent(e);
    if (e.type === "status") tb.status(e.text);
    if (e.type === "thinking") tb.thought(e.text);
    if (e.type === "tool") tb.step(e.label, !e.result?.error);
    if (e.type === "payment") tb.settled().then(() => orderCard(e.payment));
    if (e.type === "reply" && e.text) tb.settled().then(() => { const b = document.createElement("div"); b.className = "b ai"; b.textContent = e.text.replace("Your order from", "Your booking at").replace("შეკვეთა მზადაა", "ჯავშანი მზადაა"); replyHolder.appendChild(b); scrollChat(); });
    if (e.type === "error") tb.settled().then(() => bubble("ai", "⚠ " + e.text));
    if (e.type === "done") tb.done();
  }).catch(() => { tb.done(); bubble("ai", t().conn); });
  await tb.settled();
  S.busy = false;
  refreshHood();
}

function orderCard(p) {
  // Mirror the agent's proposal into the app's own booking, so "Review booking" shows it too.
  S.cart = { venueId: p.venue.id, lines: p.lines.map((l) => ({ itemId: l.itemId, qty: l.qty, optionIds: l.options.map((n) => item(l.itemId).options.find((o) => o.name === n).id) })) };
  S.agentPayment = p;
  S.cartSignature = sig();
  const T = t();
  document.querySelectorAll(".ocard:not(.paid) .acts").forEach((a) => a.innerHTML = `<div class="note">${esc(T.replaced)}</div>`);

  const v = venue(p.venue.id), it = item(p.lines[0].itemId), m = it.meta;
  const card = document.createElement("div");
  card.className = "ocard";
  card.innerHTML = `
    <div class="oimg"><img src="${it.image.replace("w=300", "w=600").replace("h=186", "h=372")}" alt=""><span class="badge">${v.meta.type === "Hotel" ? starStr(v.meta.stars) + " " + T.hotel : T.daily}</span></div>
    <div class="vh"><b>${esc(pvN(p.venue))}</b><small>${esc(addrL(v))} · ${dist(v)} ${T.fromYou} · <span style="color:var(--green);font-weight:600">★ ${v.rating.toFixed(1)}</span></small></div>
    <div class="ls">${p.lines.map((l) => { const i = item(l.itemId); return `<div class="line"><span class="q">${l.qty}×</span><div class="nm">${esc(rN(i))}<div class="mods">${esc(bedL(i.meta))} · ${i.meta.size} ${T.m2} · ${esc(viewL(i.meta))}</div>${l.options.length ? `<div class="mods g">+ ${esc(lopts(l).join(", "))}</div>` : ""}${l.note ? `<div class="mods">“${esc(l.note)}”</div>` : ""}</div><span class="lp">${money(l.qty * l.unitPrice)}</span></div>`; }).join("")}</div>
    <div class="facts">
      <div>${T.dates}<b>${esc(dL(m))}</b></div><div>${T.stay}<b>${esc(T.nightsGuests(m.nights, m.guests))}</b></div>
    </div>
    <div class="sums">
      <div class="sum"><span>${T.room} · ${money(m.perNight)} × ${m.nights}</span><span>${money(it.price * p.lines[0].qty)}</span></div>
      <div class="sum"><span>${T.extras}</span><span>${money(p.subtotal - it.price * p.lines[0].qty)}</span></div>
      <div class="sum"><span>${T.fee}</span><span>${money(p.serviceFee + p.deliveryFee)}</span></div>
      <div class="sum total"><span>${T.total}</span><span>${money(p.total)}</span></div>
    </div>
    <div class="pm"><span class="visa">VISA</span>${esc(p.paymentMethod)}<span style="margin-left:auto;color:var(--blue);font-weight:500">${T.change}</span></div>
    <div class="acts">
      <button class="gbtn pay">${T.pay} ${money(p.total)}</button>
      <button class="gbtn sec2 edit">${T.review}</button>
      <div class="note">${T.safe}</div>
    </div>`;
  card.querySelector(".pay").onclick = async (ev) => {
    ev.target.disabled = true;
    const paid = await payWithFaceId(p);
    if (!paid) { ev.target.disabled = false; return; }
    card.classList.add("paid");
    card.querySelector(".acts").innerHTML = `<div class="paidrow">${esc(t().paidRow(money(paid.total)))}</div>`;
    bubble("ai", t().paidMsg(rN(it), pvN(p.venue), dL(m)));
    setTimeout(() => startFulfilment(paid, true), 1200);
  };
  card.querySelector(".edit").onclick = () => { closeChat(); go("checkout"); };
  $("#msgs").appendChild(card);
  scrollChat();
}

function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("#mic");
  if (!SR) { mic.style.display = "none"; return; }
  let rec;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = ka() ? "ka-GE" : "en-US"; rec.interimResults = true;
    mic.classList.add("rec");
    rec.onresult = (e) => { $("#q").value = [...e.results].map((r) => r[0].transcript).join(""); };
    rec.onend = () => { mic.classList.remove("rec"); rec = null; if ($("#q").value.trim()) send($("#q").value); };
    rec.start();
  };
}

function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; $("#screen").appendChild(d); setTimeout(() => d.remove(), 3200); }

// ======================= under the hood =======================
function hoodClear(text) { $("#hood-trace").innerHTML = `<div class="ev st">${USER_ID} → <b>${esc(text)}</b></div>`; }
function hoodEvent(e) {
  const t = $("#hood-trace");
  const div = document.createElement("div");
  if (e.type === "status") { div.className = "ev st"; div.textContent = "⋯ agent: " + e.text; }
  else if (e.type === "thinking") { div.className = "ev st"; div.style.color = "#a9e0c4"; div.textContent = "💭 " + e.text; }
  else if (e.type === "tool") { div.className = "ev"; div.innerHTML = `<b>${esc(e.tool)}</b>(${esc(JSON.stringify(e.args))})\n→ ${esc(JSON.stringify(e.result).slice(0, 420))}`; }
  else if (e.type === "payment") { div.className = "ev pay"; div.innerHTML = `<b>payment intent</b> ${esc(e.payment.id)} · ${money(e.payment.total)} · <span class="s-awaiting">awaiting_user_confirmation</span>`; }
  else if (e.type === "reply") { div.className = "ev st"; div.textContent = "reply: " + e.text; }
  else if (e.type === "error") { div.className = "ev"; div.style.borderColor = "#f04"; div.textContent = "error: " + e.text; }
  else return;
  t.appendChild(div);
  t.parentElement.scrollTop = t.parentElement.scrollHeight;
}
async function refreshHood() {
  const s = await fetch("/debug/myhome").then((r) => r.json());
  $("#hood-agent").innerHTML = `${s.mode === "gemini" ? `Gemini <b style="color:#fff">${esc(s.model)}</b>` : `<b style="color:#ffc24b">MOCK</b> (no GEMINI_API_KEY)`} · function calling · per-tenant memory`;
  const u = Object.entries(s.memory);
  $("#hood-mem").innerHTML = u.length ? u.map(([id, m]) => `<div><b style="color:#fff">${esc(id)}</b> · ${m.history.length} messages<br>${m.preferences.map((p) => `<span class="tag">${esc(p)}</span>`).join("") || '<span style="color:#7a8a9a">no saved preferences</span>'}</div>`).join("") : '<span style="color:#7a8a9a">empty</span>';
  $("#hood-pay").innerHTML = s.payments.length ? s.payments.slice(-4).reverse().map((p) => `<div style="margin-bottom:6px">${esc(p.id)} · ${money(p.total)} · ${p.history.map((h) => `<span class="s-${h.status.split("_")[0]}">${h.status}</span><span style="color:#7a8a9a">(${h.by})</span>`).join(" → ")}</div>`).join("") : '<span style="color:#7a8a9a">none</span>';
}
$("#reset").onclick = async () => { await fetch("/debug/myhome/reset", { method: "POST" }); location.reload(); };
$("#hoodtoggle").onclick = () => { $("#hood").classList.toggle("off"); $("#hoodtoggle").textContent = $("#hood").classList.contains("off") ? "Show under the hood" : "Hide under the hood"; };

// ======================= boot =======================
(async () => {
  S.data = await fetch("/demo-data/myhome").then((r) => r.json());
  AgentPayUI.lang = LANG;
  agent = AgentPay.init({ key: "pk_myhome_demo", userId: USER_ID, location: S.data.location });
  $("#fab").onclick = () => openChat();
  renderNav();
  render();
  refreshHood();
  if (new URLSearchParams(location.search).has("clean")) { $("#hood").classList.add("off"); $("#hoodtoggle").textContent = "Show under the hood"; }
})();
</script>
