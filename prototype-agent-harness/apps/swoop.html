<!doctype html>
<!-- PROTOTYPE — throwaway investor demo. A swoop.ge look-alike host app (deals & vouchers) with the AgentPay agent built in via /sdk.js.
     TEST CASE: "Buy 2 vouchers for a private sulfur bath room at the nearest bathhouse"
     Everything Swoop-specific (deal cards, deal page, checkout, vouchers) is "the client's app"; the agent + payments come from our API. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Swoop — AI deals demo</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
<link rel="icon" type="image/png" href="/favicon.png?v=2" sizes="64x64" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Georgian:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --yellow: #FFE100; --yellow-btn: #FFD800; --yellow-soft: #FFFBE6; --red: #FF1701; --red-logo: #FF0000;
    --text: #161616; --raisin: #272a37; --muted: #6b7280; --faint: #9ca3af; --line: #e9eaeb; --surface: #f6f6f6;
    --green: #12b76a; --radius: 12px;
    font-family: Inter, "Noto Sans Georgian", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #f1efe6; color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 24px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  img { display: block; }
  .ka { font-family: "Noto Sans Georgian", Inter, sans-serif; }

  /* ---------- phone frame ---------- */
  .phone { width: 390px; height: 844px; border-radius: 54px; background: #111; padding: 11px; box-shadow: 0 30px 80px rgba(0,0,0,.25); flex-shrink: 0; position: relative; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #fff; position: relative; display: flex; flex-direction: column; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #111; border-radius: 20px; z-index: 100; }
  .statusbar { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px 34px; font-weight: 700; font-size: 15px; flex-shrink: 0; z-index: 40; background: #fff; transition: background .2s; }
  .statusbar.y { background: var(--yellow); }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  @media (max-width: 520px) {
    body { padding: 0; background: #fff; display: block; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; }
    .island, .statusbar, .hood { display: none !important; }
    .chat { top: 0 !important; }
  }
  .view { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
  .view::-webkit-scrollbar { display: none; }

  /* ---------- home header (yellow wave) ---------- */
  .yhead { background: var(--yellow); position: relative; padding: 4px 16px 30px; }
  .yhead .wave { position: absolute; left: 0; right: 0; bottom: -22px; width: 100%; height: 24px; }
  .ytop { display: flex; align-items: center; gap: 10px; }
  .ytop .logo svg { height: 30px; width: auto; display: block; }
  .ytop .sp { flex: 1; }
  .ibtn { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.55); display: grid; place-items: center; }
  .aibtn { display: flex; align-items: center; gap: 5px; background: var(--text); color: #fff; border-radius: 12px; padding: 8px 10px; font-weight: 700; font-size: 13px; }
  .aibtn .beta { background: var(--yellow); color: var(--text); border-radius: 6px; font-size: 9.5px; padding: 1px 4px; font-weight: 800; }
  .lang { font-weight: 700; font-size: 13px; padding: 0 2px; }
  .yhero { margin-top: 16px; }
  .yhero h1 { font-size: 25px; line-height: 1.1; font-weight: 900; text-transform: uppercase; letter-spacing: -.3px; }
  .yhero .loc { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-weight: 600; font-size: 13px; color: var(--raisin); }
  .search { margin-top: 14px; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 12px 12px 12px 14px; color: var(--muted); font-weight: 500; font-size: 14.5px; width: 100%; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .search .ai { margin-left: auto; background: var(--text); color: #fff; font-weight: 700; font-size: 12.5px; padding: 6px 10px; border-radius: 9px; display: flex; gap: 4px; align-items: center; white-space: nowrap; }
  .cats { display: flex; gap: 10px; overflow-x: auto; padding: 30px 16px 6px; scrollbar-width: none; }
  .cat { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; flex-shrink: 0; width: 66px; color: var(--raisin); }
  .cat .ic { width: 58px; height: 58px; border-radius: 18px; background: var(--surface); display: grid; place-items: center; font-size: 27px; }
  .cat.on .ic { background: var(--yellow); }
  .tabs { position: sticky; top: 0; background: #fff; z-index: 6; display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .tabs button { padding: 8px 14px; border-radius: 99px; background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; color: var(--raisin); }
  .tabs button.on { background: var(--text); color: #fff; }
  .moods { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 14px; scrollbar-width: none; }
  .moods span { flex-shrink: 0; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--raisin); }
  .promo { margin: 4px 16px 20px; border-radius: 16px; padding: 16px; background: var(--text); color: #fff; position: relative; overflow: hidden; display: block; width: calc(100% - 32px); text-align: left; }
  .promo h3 { font-size: 18px; font-weight: 800; line-height: 1.2; margin-bottom: 5px; max-width: 250px; }
  .promo p { font-size: 13px; opacity: .8; font-weight: 500; max-width: 240px; }
  .promo .cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; background: var(--yellow); color: var(--text); padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 13.5px; }
  .promo .spark { position: absolute; right: 10px; top: 4px; font-size: 90px; color: var(--yellow); opacity: .9; }
  .sec { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 12px; }
  .sec h2 { font-size: 19px; font-weight: 900; text-transform: uppercase; letter-spacing: -.2px; display: flex; gap: 8px; align-items: center; }
  .sec a { color: var(--muted); font-weight: 600; font-size: 13.5px; }
  .carousel { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 24px; scrollbar-width: none; }
  .carousel .dc { width: 258px; flex-shrink: 0; }
  .grid { padding: 0 16px 120px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid .dimg { height: 112px; }
  .grid .dc h3 { font-size: 13.5px; }
  .grid .dbody { padding: 9px; gap: 8px; }
  .grid .pr b { font-size: 15px; }

  /* ---------- deal card (swoop style) ---------- */
  .dc { border-radius: 12px; display: flex; flex-direction: column; background: #fff; text-align: left; cursor: pointer; }
  .dimg { position: relative; height: 160px; border-radius: 12px 12px 0 0; overflow: hidden; background: var(--surface); }
  .dimg img { width: 100%; height: 100%; object-fit: cover; }
  .heart { position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border-radius: 10px; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); display: grid; place-items: center; color: #fff; }
  .badge { position: absolute; left: 10px; top: 10px; background: var(--red); color: #fff; font-weight: 800; font-size: 15px; border-radius: 9px; padding: 4px 8px; box-shadow: 0 2px 6px rgba(255,23,1,.35); }
  .cd { position: absolute; left: 10px; bottom: 10px; background: rgba(22,22,22,.78); color: #fff; font-weight: 700; font-size: 11.5px; border-radius: 8px; padding: 3px 7px; display: flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
  .dbody { display: flex; flex-direction: column; gap: 10px; padding: 11px 12px 12px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; flex: 1; }
  .dc h3 { font-size: 15px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
  .vend { color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -4px; }
  .pr { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .pill { background: var(--red); color: #fff; font-weight: 800; font-size: 12.5px; border-radius: 8px; padding: 3px 7px; }
  .pr b { font-size: 17px; font-weight: 800; }
  .pr s { color: var(--faint); font-size: 13px; font-weight: 500; }
  .sold { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .sbar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .sbar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #FFE100 0%, #FF1701 100%); }
  .buy { background: var(--yellow-btn); color: var(--text); border-radius: 8px; height: 38px; font-weight: 600; font-size: 14px; display: grid; place-items: center; width: 100%; }
  .grid .buy { height: 34px; font-size: 13px; }

  /* ---------- bottom nav + floating AI ---------- */
  .nav { display: flex; justify-content: space-around; border-top: 1px solid var(--line); background: #fff; padding: 8px 0 22px; flex-shrink: 0; }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--faint); width: 70px; }
  .nav button.on { color: var(--text); }
  .nav svg { width: 24px; height: 24px; }
  .fab { position: absolute; right: 16px; bottom: 96px; z-index: 20; background: var(--text); color: #fff; border-radius: 16px; padding: 13px 18px 13px 14px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.3); }
  .fab b { color: var(--yellow); font-size: 17px; }
  .fab.hide { display: none; }

  /* ---------- deal page ---------- */
  .dhero { position: relative; height: 250px; }
  .dhero img { width: 100%; height: 100%; object-fit: cover; }
  .dhero .btns { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; }
  .dhero .dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; gap: 5px; justify-content: center; }
  .dhero .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.55); }
  .dhero .dots i:first-child { background: #fff; width: 16px; border-radius: 4px; }
  .circle { width: 38px; height: 38px; border-radius: 12px; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .dhead { padding: 16px 16px 6px; }
  .dhead .vrow { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; font-size: 13.5px; }
  .dhead .vrow .av { width: 26px; height: 26px; border-radius: 8px; background: var(--yellow); color: var(--text); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
  .dhead h1 { font-size: 22px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-top: 10px; }
  .pricebox { margin: 14px 16px 0; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .pricebox .top { display: flex; align-items: center; gap: 10px; }
  .pricebox .big { font-size: 30px; font-weight: 900; letter-spacing: -.5px; }
  .pricebox s { color: var(--faint); font-weight: 500; font-size: 16px; }
  .pricebox .pill { font-size: 15px; padding: 4px 9px; margin-left: auto; }
  .save { color: var(--green); font-weight: 700; font-size: 13.5px; margin-top: 4px; }
  .timer { display: flex; gap: 6px; align-items: center; margin-top: 12px; font-weight: 600; font-size: 13px; color: var(--muted); }
  .timer .t { display: flex; gap: 4px; margin-left: auto; }
  .timer .t span { background: var(--text); color: var(--yellow); border-radius: 7px; padding: 5px 7px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 32px; text-align: center; }
  .timer .t em { font-style: normal; color: var(--text); font-weight: 800; align-self: center; }
  .soldrow { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .dsec { padding: 18px 16px 4px; }
  .dsec h3 { font-size: 16px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; letter-spacing: -.1px; }
  .dsec p { color: #3f4350; font-size: 14px; line-height: 1.5; font-weight: 500; }
  .conds { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .conds li { display: flex; gap: 10px; font-size: 14px; font-weight: 500; color: #3f4350; }
  .conds li i { font-style: normal; width: 22px; text-align: center; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14.5px; width: 100%; text-align: left; }
  .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #d0d2d6; display: grid; place-items: center; flex-shrink: 0; }
  .opt.on .box { background: var(--text); border-color: var(--text); }
  .opt.on .box::after { content: ""; width: 10px; height: 6px; border: 2.5px solid var(--yellow); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
  .opt .x { margin-left: auto; color: var(--muted); font-size: 14px; }
  .minimap { margin-top: 10px; height: 120px; border-radius: 12px; overflow: hidden; position: relative; background: #eef0ea; }
  .more { display: flex; gap: 12px; overflow-x: auto; padding: 4px 16px 130px; scrollbar-width: none; }
  .more .dc { width: 220px; flex-shrink: 0; }
  .more .dimg { height: 120px; }
  .buybar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px 26px; display: flex; gap: 12px; align-items: center; }
  .stepper { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 10px; padding: 0 12px; font-weight: 800; font-size: 16px; height: 48px; }
  .stepper button { font-size: 22px; width: 22px; font-weight: 600; }
  .btn { background: var(--yellow-btn); color: var(--text); border-radius: 10px; height: 48px; padding: 0 16px; font-weight: 700; font-size: 15.5px; flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .btn:disabled { opacity: .5; }
  .ocard .acts .btn, #cobtn { flex: none; width: 100%; }
  .btn.dark { background: var(--text); color: #fff; }
  .btn.ghost { background: var(--surface); }

  /* ---------- checkout ---------- */
  .pagehead { display: flex; align-items: center; gap: 12px; padding: 8px 16px 12px; position: sticky; top: 0; background: #fff; z-index: 5; border-bottom: 1px solid var(--line); }
  .pagehead h1 { font-size: 18px; font-weight: 800; }
  .seg { display: flex; background: var(--surface); border-radius: 12px; padding: 4px; margin-bottom: 10px; }
  .seg div { flex: 1; text-align: center; padding: 8px; border-radius: 9px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
  .seg .on { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .block { padding: 16px 16px 4px; }
  .block h3 { font-size: 15px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border-radius: 12px; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .row .ic { width: 36px; height: 36px; border-radius: 10px; background: #fff; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
  .row small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .row .chev { margin-left: auto; color: var(--faint); }
  .line { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .line img { width: 58px; height: 44px; border-radius: 8px; object-fit: cover; }
  .line .q { font-weight: 800; min-width: 24px; }
  .line .nm { flex: 1; font-weight: 700; font-size: 14px; line-height: 1.3; }
  .line .mods { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .line .prc { font-weight: 800; font-size: 14px; text-align: right; }
  .line .prc s { display: block; color: var(--faint); font-weight: 500; font-size: 12px; }
  .sum { display: flex; justify-content: space-between; font-weight: 500; color: var(--muted); font-size: 14px; padding: 4px 0; }
  .sum.green { color: var(--green); font-weight: 700; }
  .sum.total { color: var(--text); font-weight: 900; font-size: 17px; padding-top: 8px; }

  /* ---------- vouchers (confirmation) ---------- */
  .okhead { background: var(--yellow); padding: 18px 16px 34px; text-align: center; position: relative; }
  .okhead .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--text); color: var(--yellow); display: grid; place-items: center; margin: 0 auto 10px; animation: pop .4s ease-out; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .okhead h1 { font-size: 22px; font-weight: 900; text-transform: uppercase; }
  .okhead p { font-size: 13.5px; font-weight: 600; color: var(--raisin); margin-top: 4px; }
  .okhead .wave { position: absolute; left: 0; bottom: -22px; width: 100%; height: 24px; }
  .vouchers { padding: 34px 16px 10px; display: flex; flex-direction: column; gap: 14px; }
  .vch { border-radius: 16px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.08); border: 1px solid var(--line); animation: up .35s ease-out both; }
  .vch .vt { display: flex; gap: 10px; padding: 12px; align-items: center; }
  .vch .vt img { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; }
  .vch .vt b { font-size: 14px; font-weight: 800; display: block; line-height: 1.25; }
  .vch .vt small { color: var(--muted); font-size: 12px; font-weight: 600; }
  .vch .cut { height: 0; border-top: 2px dashed var(--line); margin: 0 14px; position: relative; }
  .vch .cut::before, .vch .cut::after { content: ""; position: absolute; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 1px solid var(--line); }
  .vch .cut::before { left: -23px; } .vch .cut::after { right: -23px; }
  .vch .vb { padding: 12px 14px 14px; display: flex; align-items: center; gap: 12px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; font-weight: 800; letter-spacing: 1px; }
  .vch .vb small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 600; margin-top: 2px; }
  .qr { width: 64px; height: 64px; margin-left: auto; flex-shrink: 0; }
  .agentpaid { display: flex; gap: 10px; align-items: center; background: var(--yellow-soft); border: 1px solid #ffe98a; border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 13px; color: var(--raisin); margin: 4px 16px 6px; }

  /* ---------- fulfilment (issuing) ---------- */
  .okhead .tick.spin { background: #161616; position: relative; }
  .okhead .tick.spin::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 3px solid rgba(22,22,22,.15); border-top-color: #161616; animation: spin 1s linear infinite; }
  .flive { padding: 34px 16px 30px; display: flex; flex-direction: column; gap: 12px; }
  .fcodes { display: flex; flex-direction: column; gap: 8px; opacity: .35; transition: opacity .3s; }
  .fcodes.on { opacity: 1; }
  .mv { display: flex; gap: 10px; align-items: center; border: 1px dashed #d0d2d6; border-radius: 12px; padding: 8px 10px; background: #fff; }
  .mv img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
  .mv small { color: var(--muted); font-size: 11px; font-weight: 600; display: block; }
  .mv .code { font-size: 16px; color: var(--faint); }
  .mv .code.lock { color: var(--text); animation: pop .3s ease-out; }
  .partner { border: 1px solid var(--line); border-radius: 14px; padding: 12px; opacity: .35; transition: opacity .3s; background: #fafafa; }
  .partner.on { opacity: 1; }
  .ph { display: flex; gap: 10px; align-items: center; }
  .ph .pl { width: 34px; height: 34px; border-radius: 10px; background: #1d4ed8; color: #fff; display: grid; place-items: center; font-weight: 900; }
  .ph b { font-size: 14px; font-weight: 800; display: block; }
  .ph small { color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .pst { margin-left: auto; font-size: 11.5px; font-weight: 800; padding: 4px 9px; border-radius: 99px; background: var(--surface); color: var(--muted); }
  .pst.new { background: #fff3c4; color: #8a6d00; } .pst.ok { background: #e3f8ec; color: #0e8a4f; }
  .pin { margin-top: 10px; font-size: 12.5px; font-weight: 600; color: var(--raisin); background: #fff; border-radius: 10px; padding: 8px 10px; border: 1px solid var(--line); animation: up .3s ease-out; }
  .pin small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; font-family: ui-monospace, Menlo, monospace; }
  .pin.ok { border-color: #a6e9c5; background: #f1fcf6; }
  .slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 10px; }
  .slots:empty { display: none; }
  .slot { text-align: center; font-size: 11.5px; font-weight: 700; padding: 7px 0; border-radius: 8px; background: #fff; border: 1px solid var(--line); color: var(--faint); transition: all .25s; }

// ======================= vouchers (confirmation) =======================
function voucherCodes(p) {
  // deterministic pseudo-codes per payment + unit
  let seed = [...p.id].reduce((s, c) => (s * 31 + c.charCodeAt(0)) >>> 0, 7);
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const next = () => ((seed = (Math.imul(seed, 1103515245) + 12345) >>> 0) >>> 16) % A.length;
  const out = [];
  p.lines.forEach((l) => { for (let i = 0; i < l.qty; i++) out.push({ l, code: "SW-" + Array.from({ length: 4 }, () => A[next()]).join("") + "-" + Array.from({ length: 4 }, () => A[next()]).join("") }); });
  return out;
}
function qrArt(code) {
  let s = [...code].reduce((a, c) => (a * 33 + c.charCodeAt(0)) >>> 0, 5);
  const cells = [];
  for (let y = 0; y < 13; y++) for (let x = 0; x < 13; x++) {
    const finder = (x < 4 && y < 4) || (x > 8 && y < 4) || (x < 4 && y > 8);
    if (finder) continue;
    s = (Math.imul(s, 1103515245) + 12345) >>> 0;
    if ((s >>> 16) & 1) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
  }
  const f = (x, y) => `<rect x="${x}" y="${y}" width="4" height="4" fill="none" stroke="#161616" stroke-width=".9" transform="translate(.45 .45) scale(.93)"/><rect x="${x + 1.2}" y="${y + 1.2}" width="1.6" height="1.6"/>`;
  return `<svg class="qr" viewBox="0 0 13 13" fill="#161616" shape-rendering="crispEdges">${cells.join("")}${f(0, 0)}${f(9, 0)}${f(0, 9)}</svg>`;
}
// ======================= fulfilment: the real voucher process, visualised live =======================
// Payment captured → codes generated → partner notified (Swoop Partner system) → slot availability → booking confirmed
// by the partner → vouchers sent by SMS + email → "My vouchers". Language is fixed when the purchase starts (EN / ქარ).
const OK = () => S.order?.ka;                                   // fulfilment / voucher screens in Georgian?
const tr = (en, kaStr) => (OK() ? kaStr : en);
const pvName = (pv) => (OK() && pv.nameKa) || pv.name;          // payment-intent venue
const pvArea = (pv) => (OK() && pv.areaKa) || pv.area;
const lnF = (l) => (OK() && l.nameKa) || l.name;
const loF = (l) => (OK() && l.optionsKa) || l.options;
const guestsKa = (g) => g.replace(/^up to (\d+) guests$/, "მაქს. $1 სტუმარი").replace(/^two guests$/, "ორი სტუმარი").replace(/^(\d+) persons?$/, "$1 ადამიანი");
function bookingPlan(p) {
  const v = venue(p.venue.id), it = item(p.lines[0].itemId);
  const bath = /bath/i.test(v.cuisine);
  const slots = bath ? [["16:00", 0], ["17:00", 0], ["18:00", 1], ["19:00", 1], ["20:00", 0], ["21:00", 1]]
                     : [["11:00", 0], ["12:00", 1], ["13:00", 1], ["14:00", 0], ["15:00", 1], ["16:00", 1]];
  const at = slots.find((s) => s[1])[0];
  const end = String(+at.slice(0, 2) + 1).padStart(2, "0") + ":00";
  const g = it.meta?.guests ?? "";
  return OK()
    ? { day: bath ? "დღეს" : "ხვალ", slots, at, end, room: bath ? "ოთახი 3" : "ადგილი დაჯავშნილია", guests: g && guestsKa(g), bath }
    : { day: bath ? "Today" : "Tomorrow", slots, at, end, room: bath ? "Room 3" : "Table / spot reserved", guests: g, bath };
}
let fulfilRun, scrambleTimer;
function startFulfilment(p, viaAgent) {
  const codes = voucherCodes(p);
  S.order = { p, viaAgent, codes, booking: null, ka: ka() };
  S.order.plan = bookingPlan(p);
  S.cart = { venueId: null, lines: [] };
  S.agentPayment = null;
  closeChat();
  fulfilRun?.cancel(); clearInterval(scrambleTimer);

  bubble("me", text);
  const tb = AgentPayUI.thinking($("#msgs"), { accent: "#161616", onUpdate: scrollChat });
  const replyHolder = document.createElement("div");
  replyHolder.style.display = "contents";
  $("#msgs").appendChild(replyHolder);
  hoodClear(text);
  await agent.send(text, (e) => {
    hoodEvent(e);
    if (e.type === "status") tb.status(e.text);
    if (e.type === "thinking") tb.thought(e.text);
    if (e.type === "tool") tb.step(e.label, !e.result?.error);
    if (e.type === "payment") tb.settled().then(() => orderCard(e.payment));
    if (e.type === "reply" && e.text) tb.settled().then(() => { const b = document.createElement("div"); b.className = "b ai"; b.textContent = e.text; replyHolder.appendChild(b); scrollChat(); });
    if (e.type === "error") tb.settled().then(() => bubble("ai", "⚠ " + e.text));
    if (e.type === "done") tb.done();
  }).catch(() => { tb.done(); bubble("ai", t().conn); });
  await tb.settled();
  S.busy = false;
  refreshHood();
}

function orderCard(p) {
  // Mirror the agent's proposal into the app's own cart, so checkout shows it too.
  S.cart = { venueId: p.venue.id, lines: p.lines.map((l) => ({ itemId: l.itemId, qty: l.qty, optionIds: l.options.map((n) => item(l.itemId).options.find((o) => o.name === n).id) })) };
  S.agentPayment = p;
  S.cartSignature = sig();
  document.querySelectorAll(".ocard:not(.paid) .acts").forEach((a) => a.innerHTML = `<div class="note">${t().replaced}</div>`);
  const v = venue(p.venue.id);
  const vn = (ka() && p.venue.nameKa) || p.venue.name, va = (ka() && p.venue.areaKa) || p.venue.area;
  const saved = p.lines.reduce((s, l) => s + ((item(l.itemId)?.meta?.oldPrice ?? 0) - (item(l.itemId)?.price ?? 0)) * l.qty, 0);
  const card = document.createElement("div");
  card.className = "ocard";
  card.innerHTML = `
    <div class="vh"><img src="${p.venue.image}" alt=""><div><b>${esc(vn)}</b><small>${esc(va)} · ${t().fromYou(kmTxt(v))}</small></div></div>
    <div class="ls">${p.lines.map((l) => { const it = item(l.itemId); return `<div class="line">${l.image ? `<img src="${l.image}" alt="">` : ""}<span class="q">${l.qty}×</span>
      <div class="nm">${esc(lname(l))}${l.options.length ? `<div class="mods">+ ${esc(lopts(l).join(", "))}</div>` : ""}${l.note ? `<div class="mods">“${esc(l.note)}”</div>` : ""}<div class="mods"><span class="pill" style="font-size:11px;padding:1px 5px">-${it.meta.discount}%</span> ${t().valid(esc(it.meta.validUntil))}</div></div>
      <span class="prc">${money2(l.qty * l.unitPrice)}<s>${money2(l.qty * (it.meta.oldPrice + (l.unitPrice - it.price)))}</s></span></div>`; }).join("")}</div>
    <div class="sums">
      <div class="sum green"><span>${t().save}</span><span>−${money2(saved)}</span></div>
      <div class="sum"><span>${t().vouchers}</span><span>${money2(p.subtotal)}</span></div>
      <div class="sum"><span>${t().service}</span><span>${money2(p.serviceFee)}</span></div>
      <div class="sum total"><span>${t().total}</span><span>${money2(p.total)}</span></div>
    </div>
    <div class="pm"><span class="visa">VISA</span>${esc(p.paymentMethod)}<span style="margin-left:auto;color:var(--muted)">${t().change}</span></div>
    <div class="acts">
      <button class="btn pay">${t().pay} ${money2(p.total)}</button>
      <button class="btn ghost edit">${t().review}</button>
      <div class="note">${t().safe}</div>
    </div>`;
  card.querySelector(".pay").onclick = async (ev) => {
    ev.target.disabled = true;
    const paid = await payWithFaceId(p);
    if (!paid) { ev.target.disabled = false; return; }
    card.classList.add("paid");
    card.querySelector(".acts").innerHTML = `<div class="paidrow">${t().paidRow(money2(paid.total))}</div>`;
    bubble("ai", t().done(paid.lines.reduce((s, l) => s + l.qty, 0), vn));
    setTimeout(() => startFulfilment(paid, true), 1400);
  };
  card.querySelector(".edit").onclick = () => { closeChat(); go("checkout"); };
  $("#msgs").appendChild(card);
  scrollChat();
}

function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("#mic");
  if (!SR) { mic.style.display = "none"; return; }
  let rec;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = ka() ? "ka-GE" : "en-US"; rec.interimResults = true;
    mic.classList.add("rec");
    rec.onresult = (e) => { $("#q").value = [...e.results].map((r) => r[0].transcript).join(""); };
    rec.onend = () => { mic.classList.remove("rec"); rec = null; if ($("#q").value.trim()) send($("#q").value); };
    rec.start();
  };
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; $("#screen").appendChild(d); setTimeout(() => d.remove(), 3200); }

// ======================= under the hood =======================
function hoodClear(text) { $("#hood-trace").innerHTML = `<div class="ev st">${USER_ID} → <b>${esc(text)}</b></div>`; }
function hoodEvent(e) {
  const t = $("#hood-trace");
  const div = document.createElement("div");
  if (e.type === "status") { div.className = "ev st"; div.textContent = "⋯ agent: " + e.text; }
  else if (e.type === "thinking") { div.className = "ev st"; div.style.color = "#d9cf9a"; div.textContent = "💭 " + e.text; }
  else if (e.type === "tool") { div.className = "ev"; div.innerHTML = `<b>${esc(e.tool)}</b>(${esc(JSON.stringify(e.args))})\n→ ${esc(JSON.stringify(e.result).slice(0, 420))}`; }
  else if (e.type === "payment") { div.className = "ev pay"; div.innerHTML = `<b>payment intent</b> ${esc(e.payment.id)} · ${money2(e.payment.total)} · <span class="s-await">awaiting_user_confirmation</span>`; }
  else if (e.type === "reply") { div.className = "ev st"; div.textContent = "reply: " + e.text; }
  else if (e.type === "error") { div.className = "ev"; div.style.borderColor = "#f04"; div.textContent = "error: " + e.text; }
  else return;
  t.appendChild(div);
  t.parentElement.scrollTop = t.parentElement.scrollHeight;
}
async function refreshHood() {
  const s = await fetch("/debug/swoop").then((r) => r.json());
  $("#hood-agent").innerHTML = `${s.mode === "gemini" ? `Gemini <b style="color:#fff">${esc(s.model)}</b>` : `<b style="color:#ffc24b">MOCK</b> (no Gemini calls)`} · function calling · per-tenant memory`;
  const u = Object.entries(s.memory);
  $("#hood-mem").innerHTML = u.length ? u.map(([id, m]) => `<div><b style="color:#fff">${esc(id)}</b> · ${m.history.length} messages<br>${m.preferences.map((p) => `<span class="tag">${esc(p)}</span>`).join("") || '<span style="color:#8f8a72">no saved preferences</span>'}</div>`).join("") : '<span style="color:#8f8a72">empty</span>';
  $("#hood-pay").innerHTML = s.payments.length ? s.payments.slice(-4).reverse().map((p) => `<div style="margin-bottom:6px">${esc(p.id)} · ${money2(p.total)} · ${p.history.map((h) => `<span class="s-${h.status.split("_")[0]}">${h.status}</span><span style="color:#8f8a72">(${h.by})</span>`).join(" → ")}</div>`).join("") : '<span style="color:#8f8a72">none</span>';
}
$("#reset").onclick = async () => { await fetch("/debug/swoop/reset", { method: "POST" }); location.reload(); };
$("#hoodtoggle").onclick = () => { $("#hood").classList.toggle("off"); $("#hoodtoggle").textContent = $("#hood").classList.contains("off") ? "Show under the hood" : "Hide under the hood"; };

// ======================= boot =======================
(async () => {
  S.data = await fetch("/demo-data/swoop").then((r) => r.json());
  AgentPayUI.lang = LANG;
  agent = AgentPay.init({ key: "pk_swoop_demo", userId: USER_ID, location: S.data.location });
  $("#fab").onclick = () => openChat();
  renderNav();
  render();
  refreshHood();
  if (new URLSearchParams(location.search).has("clean")) { $("#hood").classList.add("off"); $("#hoodtoggle").textContent = "Show under the hood"; }
})();
</script>
