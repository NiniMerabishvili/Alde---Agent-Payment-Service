<!doctype html>
<!-- PROTOTYPE — throwaway investor demo. A Biblusi (biblusi.ge) look-alike shop with the AgentPay agent built in via /sdk.js.
     Everything Biblusi-specific (home, book page, cart, checkout, confirmation) is "the client's app"; agent + payments come from our API.
     TEST CASE: "Buy Harry Potter and the Philosopher's Stone in Georgian with gift wrapping"
       → 1× Harry Potter and the Philosopher's Stone (Georgian) + Gift wrapping, from the nearest store (Biblusi Pekini). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Biblusi — AI book shopping demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+Georgian:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand: #084fa3; --brand-dark: #063d80; --brand-08: rgba(8,79,163,.08); --brand-16: rgba(8,79,163,.16);
    --orange: #f29e30; --green: #94b228; --red: #ce181e; --dark: #272829;
    --text: #212529; --muted: #8a8a8a; --line: #e7e7e8; --bg: #f5f5f5; --radius: 14px;
    font-family: "Noto Sans", "Noto Sans Georgian", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #e9edf3; color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 24px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  img { display: block; }
  .ka { font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }

  /* ---------- phone frame ---------- */
  .phone { width: 390px; height: 844px; border-radius: 54px; background: #111; padding: 11px; box-shadow: 0 30px 80px rgba(0,0,0,.25); flex-shrink: 0; position: relative; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: var(--bg); position: relative; display: flex; flex-direction: column; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #111; border-radius: 20px; z-index: 100; }
  .statusbar { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px 34px; font-weight: 700; font-size: 15px; flex-shrink: 0; z-index: 40; background: #fff; }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  @media (max-width: 520px) {
    body { padding: 0; background: #fff; display: block; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; }
    .island, .statusbar, .hood { display: none !important; }
    .chat { top: 0 !important; }
  }
  .view { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
  .view::-webkit-scrollbar { display: none; }

  /* ---------- header (as on biblusi.ge mobile) ---------- */
  .hdr { background: #fff; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,.05); }
  .brands { display: flex; justify-content: center; align-items: center; gap: 22px; padding: 2px 0 6px; border-bottom: 1px solid var(--line); }
  .logo { position: relative; display: inline-block; font-family: "Noto Sans Georgian"; font-weight: 900; color: var(--brand); font-size: 23px; letter-spacing: -.5px; line-height: 1; padding-right: 14px; }
  .logo i { position: absolute; right: -6px; bottom: -7px; background: var(--orange); color: #fff; font-style: italic; font-family: "Noto Sans"; font-weight: 800; font-size: 9px; padding: 2px 5px 2px 4px; transform: rotate(-12deg); border-radius: 2px 6px 2px 2px; letter-spacing: 0; }
  .sub-brand { font-weight: 900; font-size: 13px; padding: 4px 7px; border-radius: 99px; font-family: "Noto Sans Georgian"; }
  .sub-brand.a { background: #e1251b; color: #ffd84a; transform: rotate(-6deg); }
  .sub-brand.b { background: linear-gradient(135deg, #94b228 0 50%, #f29e30 50%); color: #fff; border-radius: 6px; padding: 4px 6px; }
  .hrow { display: flex; gap: 10px; padding: 10px 12px; align-items: center; }
  .sbox { flex: 1; display: flex; align-items: center; justify-content: space-between; border: 1px solid #bdc3cd; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #555; text-align: left; font-family: "Noto Sans Georgian"; }
  .sbox .ai { color: var(--brand); font-weight: 800; font-size: 12px; margin-left: auto; margin-right: 8px; font-family: "Noto Sans"; }
  .sq { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; background: #fff; position: relative; flex-shrink: 0; }
  .sq.blue { background: var(--brand); border-color: var(--brand); color: #fff; }
  .sq .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
  .deliv { display: flex; align-items: center; gap: 5px; padding: 0 12px 10px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .deliv span { overflow: hidden; text-overflow: ellipsis; }
  .deliv b { color: var(--text); font-weight: 700; }

  /* ---------- home ---------- */
  .banner { margin: 14px 12px 6px; border-radius: 16px; overflow: hidden; position: relative; background: linear-gradient(115deg, #2d3a8c 0%, #084fa3 55%, #1f7ad6 100%); color: #fff; padding: 18px 16px 16px; text-align: left; display: block; width: calc(100% - 24px); min-height: 148px; }
  .banner h3 { font-size: 20px; font-weight: 900; line-height: 1.15; max-width: 205px; }
  .banner p { font-size: 12.5px; opacity: .9; margin-top: 6px; max-width: 210px; font-weight: 500; }
  .banner .cta { display: inline-block; margin-top: 12px; background: var(--red); color: #fff; padding: 6px 12px; border-radius: 99px; font-weight: 800; font-size: 12px; }
  .banner .stack { position: absolute; right: 4px; top: 22px; width: 110px; height: 120px; }
  .banner .stack .cover { position: absolute; width: 66px; box-shadow: 0 8px 18px rgba(0,0,0,.35); }
  .dots { display: flex; gap: 10px; justify-content: center; padding: 8px 0 12px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #d8d8d8; }
  .dots i.on { background: var(--brand); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 16px; }
  .tile { background: #fff; border-radius: 14px; padding: 12px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13px; text-align: left; min-height: 66px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .tile .em { font-size: 26px; }
  .tile small { display: block; color: var(--muted); font-weight: 600; font-size: 11px; }
  .shelf { padding: 18px 0 20px; }
  .shelf.dark { background: var(--dark); color: #fff; }
  .shelf-h { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 4px; }
  .shelf-h h2 { font-size: 21px; font-weight: 800; font-family: "Noto Sans Georgian"; }
  .shelf-h .arr { display: flex; gap: 8px; }
  .shelf-h .arr span { width: 32px; height: 32px; border-radius: 8px; background: #fff; color: var(--text); display: grid; place-items: center; border: 1px solid var(--line); font-size: 15px; }
  .shelf-sub { padding: 0 16px 12px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .shelf.dark .shelf-sub { color: #b9b9b9; }
  .row-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
  .row-scroll::-webkit-scrollbar { display: none; }
  .bcard { width: 160px; flex-shrink: 0; background: #fff; border-radius: 10px; overflow: hidden; text-align: left; color: var(--text); display: flex; flex-direction: column; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .bcard .cv { background: var(--cvbg, #eee); padding: 14px 22px; display: grid; place-items: center; }
  .bcard .cv .cover { width: 100%; }
  .bcard .bd { padding: 10px 10px 10px; flex: 1; display: flex; flex-direction: column; }
  .bcard .tt { font-weight: 700; font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px; }
  .bcard .au { color: var(--brand); font-size: 12px; font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bcard .ft { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .pr { color: var(--brand); font-weight: 800; font-size: 15px; white-space: nowrap; }
  .pr s { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 4px; }
  .addc { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text); background: #fff; }
  .lang { display: inline-block; align-self: flex-start; font-size: 10px; font-weight: 800; color: #fff; background: var(--brand); border-radius: 4px; padding: 1px 5px; margin-bottom: 4px; letter-spacing: .03em; }
  .lang.en { background: var(--orange); }
  .showall { display: block; margin: 16px 16px 0; background: #fff; color: var(--text); border-radius: 12px; padding: 13px; text-align: center; font-weight: 600; font-size: 14px; width: calc(100% - 32px); border: 1px solid var(--line); font-family: "Noto Sans Georgian"; }
  .stores { padding: 0 12px 120px; display: flex; flex-direction: column; gap: 10px; }
  .store { background: #fff; border-radius: 14px; overflow: hidden; display: flex; gap: 12px; padding: 10px; align-items: center; text-align: left; }
  .store img { width: 76px; height: 58px; border-radius: 10px; object-fit: cover; }
  .store b { font-size: 14.5px; font-weight: 800; display: block; }
  .store small { color: var(--muted); font-size: 12px; font-weight: 500; display: block; }
  .store .tag { margin-left: auto; text-align: right; font-size: 12px; font-weight: 700; color: var(--brand); white-space: nowrap; }
  .store .tag.near { color: var(--green); }

  /* ---------- CSS book covers ---------- */
  .cover { aspect-ratio: 2/3; background: var(--c1); color: var(--c3); border-radius: 2px 5px 5px 2px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 9% 9% 8% 13%;
    box-shadow: inset 4px 0 0 rgba(0,0,0,.22), inset 6px 0 0 rgba(255,255,255,.1), 0 6px 14px rgba(0,0,0,.25); font-family: "Noto Sans Georgian", "Noto Sans", sans-serif; }
  .cover::before { content: ""; position: absolute; left: 0; right: 0; top: 52%; height: 3px; background: var(--c2); opacity: .9; }
  .cover .ct { font-weight: 900; font-size: var(--fs, 11px); line-height: 1.15; text-transform: uppercase; letter-spacing: .01em; position: relative; z-index: 1; overflow-wrap: break-word; hyphens: manual; }
  .cover .cm { font-size: calc(var(--fs, 11px) * 2.6); text-align: center; position: relative; z-index: 1; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .cover .ca { font-size: calc(var(--fs, 11px) * .72); font-weight: 700; color: var(--c2); position: relative; z-index: 1; text-transform: uppercase; letter-spacing: .04em; }

  /* ---------- book page ---------- */
  .bhero { position: relative; height: 400px; overflow: hidden; display: grid; place-items: center; }
  .bhero .blur { position: absolute; inset: -40px; background: var(--c1); filter: blur(30px) saturate(1.3); opacity: .85; }
  .bhero .blur::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 40px, rgba(0,0,0,.08) 40px 80px); }
  .bhero .cover { width: 210px; position: relative; }
  .bhero .back { position: absolute; top: 12px; left: 12px; }
  .bhero .heart { position: absolute; top: 12px; right: 12px; }
  .circle { width: 38px; height: 38px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .bpanel { background: var(--bg); padding: 14px 16px 6px; }
  .stars { display: flex; align-items: center; gap: 3px; color: var(--orange); font-size: 19px; }
  .stars small { color: var(--muted); font-size: 12.5px; margin-left: 8px; font-weight: 500; }
  .bicons { margin-left: auto; display: flex; gap: 8px; }
  .bicons span { width: 38px; height: 38px; border: 1px solid #ccc; border-radius: 10px; display: grid; place-items: center; font-size: 15px; }
  .btitle { font-size: 21px; font-weight: 800; margin-top: 12px; line-height: 1.25; }
  .bka { font-family: "Noto Sans Georgian"; color: var(--muted); font-size: 14px; font-weight: 600; margin-top: 2px; }
  .bauthor { color: var(--brand); font-weight: 600; font-size: 14.5px; margin-top: 6px; }
  .info { background: #e9e9e9; padding: 14px 16px; font-size: 13.5px; line-height: 1.7; }
  .info small { color: var(--muted); display: block; font-size: 12.5px; }
  .desc { padding: 16px; background: #fff; font-size: 14.5px; line-height: 1.65; }
  .opts { padding: 6px 16px 10px; background: #fff; }
  .opts h4 { font-size: 15px; font-weight: 800; margin: 10px 0 2px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14.5px; width: 100%; text-align: left; }
  .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #bdc3cd; display: grid; place-items: center; flex-shrink: 0; }
  .opt.on .box { background: var(--brand); border-color: var(--brand); }
  .opt.on .box::after { content: ""; width: 10px; height: 6px; border: 2.5px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
  .opt .x { margin-left: auto; color: var(--brand); font-size: 14px; font-weight: 700; }
  .specs { background: #fff; padding: 6px 16px 120px; }
  .specs h4 { font-size: 14px; font-weight: 800; margin: 14px 0 6px; font-family: "Noto Sans Georgian"; }
  .spec { display: flex; justify-content: space-between; padding: 9px 0; font-size: 13.5px; border-bottom: 1px solid #f0f0f0; }
  .spec span:first-child { color: var(--muted); }
  .buybar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; background: #fff; display: flex; align-items: center; gap: 8px; padding: 10px 10px 24px; box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
  .buybar .pq { display: flex; flex-direction: column; gap: 4px; min-width: 76px; }
  .buybar .pq .pr { font-size: 16px; }
  .qty { display: flex; align-items: center; gap: 10px; color: #555; font-size: 14px; }
  .qty button { font-size: 18px; color: #888; width: 16px; }
  .gbtn { flex: 1; height: 52px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 12.5px; font-family: "Noto Sans Georgian"; padding: 0 6px; line-height: 1.2; }
  .gbtn.express { background: linear-gradient(90deg, #c72f8c, #7b3fe4); }
  .gbtn.buy { background: var(--green); flex: .75; }
  .gbtn.cart { flex: 0 0 52px; background: var(--brand); display: grid; place-items: center; }

  /* ---------- cart / checkout ---------- */
  .pagehead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; position: sticky; top: 0; background: #fff; z-index: 5; border-bottom: 1px solid var(--line); }
  .pagehead h1 { font-size: 18px; font-weight: 800; }
  .pagehead small { color: var(--muted); font-size: 12px; font-weight: 500; display: block; }
  .card { background: #fff; border-radius: 14px; margin: 12px; padding: 14px; }
  .card h3 { font-size: 15.5px; font-weight: 800; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--bg); border-radius: 12px; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .row .ic { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
  .row small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .row .chev { margin-left: auto; color: #bbb; }
  .radio { display: flex; gap: 8px; margin-bottom: 10px; }
  .radio div { flex: 1; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; font-size: 13px; font-weight: 700; }
  .radio div small { display: block; color: var(--muted); font-weight: 500; font-size: 11.5px; }
  .radio .on { border-color: var(--brand); background: var(--brand-08); }
  .line { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .line:last-child { border-bottom: 0; }
  .line .cover { width: 44px; height: 66px; flex-shrink: 0; padding: 4px; justify-content: center; }
  .line .cover .ct, .line .cover .ca { display: none; }
  .line .cover .cm { font-size: 18px; }
  .line .q { color: var(--brand); font-weight: 800; min-width: 22px; font-size: 14px; }
  .line .nm { flex: 1; font-weight: 700; font-size: 13.5px; line-height: 1.3; }
  .line .mods { color: var(--muted); font-size: 12px; font-weight: 600; margin-top: 2px; }
  .line .lp { font-weight: 800; font-size: 13.5px; white-space: nowrap; }
  .sum { display: flex; justify-content: space-between; font-weight: 500; color: #555; font-size: 14px; padding: 4px 0; }
  .sum.total { color: var(--text); font-weight: 800; font-size: 17px; padding-top: 8px; border-top: 1px solid var(--line); margin-top: 6px; }
  .btn { background: var(--green); color: #fff; border-radius: 10px; padding: 15px 16px; font-weight: 800; font-size: 15.5px; flex: 1; display: flex; justify-content: center; gap: 8px; width: 100%; }
  .btn.blue { background: var(--brand); }
  .btn:disabled { opacity: .5; }
  .btn.sec2 { background: var(--brand-08); color: var(--brand); }
  .visa { background: #1a1f71; color: #fff; font-weight: 900; font-style: italic; font-size: 11px; padding: 3px 6px; border-radius: 4px; }
  .empty { text-align: center; padding: 60px 30px; color: var(--muted); font-weight: 600; }
  .empty .em { font-size: 54px; margin-bottom: 10px; }

  /* ---------- confirmation ---------- */
  .done-hero { background: var(--brand); color: #fff; padding: 26px 20px 46px; text-align: center; }
  .done-hero .ok { width: 68px; height: 68px; border-radius: 50%; background: var(--green); display: grid; place-items: center; margin: 0 auto 12px; }
  .done-hero .ok svg { width: 38px; height: 38px; }
  .done-hero h1 { font-size: 22px; font-weight: 900; }
  .done-hero p { opacity: .9; font-size: 13.5px; margin-top: 4px; }
  .done-body { margin-top: -30px; }
  .tl { display: flex; flex-direction: column; gap: 0; }
  .tl .st { display: flex; gap: 12px; align-items: flex-start; position: relative; padding-bottom: 14px; font-size: 14px; font-weight: 700; }
  .tl .st:not(:last-child)::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
  .tl .st.done:not(:last-child)::before { background: var(--green); }
  .tl .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: #fff; flex-shrink: 0; display: grid; place-items: center; font-size: 11px; color: #fff; }
  .tl .st.done .dot { background: var(--green); border-color: var(--green); }
  .tl .st.now .dot { border-color: var(--brand); border-top-color: transparent; animation: spin .9s linear infinite; }
  .tl small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
  .agentpaid { display: flex; gap: 10px; align-items: center; background: var(--brand-08); border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 13px; color: var(--brand-dark); margin: 12px; }

  /* ---------- nav + fab ---------- */
  .nav { display: flex; justify-content: space-around; border-top: 1px solid var(--line); background: #fff; padding: 8px 0 22px; flex-shrink: 0; }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: #9aa0a6; width: 70px; position: relative; }
  .nav button.on { color: var(--brand); }
  .nav svg { width: 24px; height: 24px; }
  .nav .badge { position: absolute; top: -4px; right: 16px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }
  .fab { position: absolute; right: 14px; bottom: 92px; z-index: 20; background: var(--brand); color: #fff; border-radius: 99px; padding: 12px 17px 12px 14px; font-weight: 800; font-size: 14.5px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px rgba(8,79,163,.45); }
  .fab.hide { display: none; }
  .toast { position: absolute; top: 60px; left: 16px; right: 16px; z-index: 95; background: var(--text); color: #fff; padding: 12px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; animation: up .25s; }
  @keyframes up { from { transform: translateY(40%); opacity: .4; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- AI chat ---------- */
  .chat { position: absolute; inset: 50px 0 0 0; background: #fff; z-index: 55; display: flex; flex-direction: column; animation: up .25s ease-out; }
  .chathead { display: flex; align-items: center; gap: 10px; padding: 8px 14px 12px; border-bottom: 1px solid var(--line); }
  .ailogo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #1f7ad6, #084fa3); color: #fff; display: grid; place-items: center; font-size: 19px; position: relative; }
  .ailogo::after { content: "AI"; position: absolute; right: -5px; bottom: -4px; background: var(--orange); font-size: 8.5px; font-weight: 900; padding: 1px 3px; border-radius: 3px; transform: rotate(-10deg); }
  .chathead b { font-weight: 800; font-size: 16px; display: block; }
  .chathead small span { min-width: 0; }
  .langsw { display: flex; background: var(--bg); border-radius: 99px; padding: 3px; flex-shrink: 0; }
  .langsw button { padding: 5px 9px; border-radius: 99px; font-weight: 800; font-size: 12px; color: var(--muted); }

// CSS-generated cover; Georgian editions show the Georgian title, like the real covers
function cover(it, fs) {
  const m = it.meta, [c1, c2, c3, motif] = m.art;
  const title = m.titleKa || it.name.replace(/\s*\((Georgian|English)\)$/, "");
  const author = m.authorKa || m.author;
  const longest = Math.max(...title.split(/\s+/).map((w) => w.length));
  if (fs && longest > 9) fs = +(fs * 10 / longest).toFixed(1);
  return `<div class="cover" style="--c1:${c1};--c2:${c2};--c3:${c3};${fs ? `--fs:${fs}px` : ""}"><div class="ct">${esc(title)}</div><div class="cm">${motif}</div><div class="ca">${esc(author)}</div></div>`;
}

function addToCart(it, qty, optionIds) {
  if (S.cart.venueId && S.cart.venueId !== it.venueId) S.cart = { venueId: null, lines: [] };

function bubble(cls, text) { const b = document.createElement("div"); b.className = "b " + cls; b.textContent = text; $("#msgs").appendChild(b); scrollChat(); return b; }

async function send(text) {
  text = text.trim();
  if (!text || S.busy) return;
  S.busy = true;
  // the agent answers in the language the user writes in — follow it in the UI too
  if (/[Ⴀ-ჿ]/.test(text) !== ka()) { LANG = ka() ? "en" : "ka"; localStorage.setItem("agentpay_lang", LANG); AgentPayUI.lang = LANG; }
  $("#q").value = "";
  $(".welcome")?.remove();
  bubble("me", text);
  const tb = AgentPayUI.thinking($("#msgs"), { accent: "#084fa3", onUpdate: scrollChat });
  const replyHolder = document.createElement("div");
  replyHolder.style.display = "contents";
  $("#msgs").appendChild(replyHolder);
  hoodClear(text);
  await agent.send(text, (e) => {
    hoodEvent(e);
    if (e.type === "status") tb.status(e.text);
    if (e.type === "thinking") tb.thought(e.text);
    if (e.type === "tool") tb.step(e.label, !e.result?.error);
    if (e.type === "payment") tb.settled().then(() => orderCard(e.payment));
    if (e.type === "reply" && e.text) tb.settled().then(() => { const b = document.createElement("div"); b.className = "b ai"; b.textContent = e.text; replyHolder.appendChild(b); scrollChat(); });
    if (e.type === "error") tb.settled().then(() => bubble("ai", "⚠ " + e.text));
    if (e.type === "done") tb.done();
  }).catch(() => { tb.done(); bubble("ai", t().conn); });
  await tb.settled();
  S.busy = false;
  refreshHood();
}

    <div class="ls">${p.lines.map((l) => lineHtml(lname(l), l.qty, lopts(l), l.qty * l.unitPrice, item(l.itemId))).join("")}</div>
    <div class="sums">
      <div class="sum"><span>${T.books}</span><span>${money(p.subtotal)}</span></div>
      <div class="sum"><span>${esc(T.deliveryTo(locShort()))}</span><span>${money(p.deliveryFee)}</span></div>
      ${p.serviceFee ? `<div class="sum"><span>${T.service}</span><span>${money(p.serviceFee)}</span></div>` : ""}
      <div class="sum total"><span>${T.total}</span><span>${money(p.total)}</span></div>
    </div>
    <div class="pm"><span class="visa">VISA</span>${esc(p.paymentMethod)}<span style="margin-left:auto;color:var(--brand)">${T.change}</span></div>
    <div class="acts">
      <button class="btn pay">${T.pay} ${money(p.total)}</button>
      <button class="btn sec2 edit">${T.review}</button>
      <div class="note">${T.safe}</div>
    </div>`;
  card.querySelector(".pay").onclick = async (ev) => {
    ev.target.disabled = true;
    const paid = await payWithFaceId(p);
    if (!paid) { ev.target.disabled = false; return; }
    card.classList.add("paid");
    card.querySelector(".acts").innerHTML = `<div class="paidrow">${t().paidRow(money(paid.total))}</div>`;
    bubble("ai", t().done(vname(p.venue), eta(v)));
    setTimeout(() => startFulfilment(paid, true), 1400);
  };
  card.querySelector(".edit").onclick = () => { closeChat(); go("cart"); };
  $("#msgs").appendChild(card);
  scrollChat();
}

function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("#mic");
  if (!SR) { mic.style.display = "none"; return; }
  let rec;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = ka() ? "ka-GE" : "en-US"; rec.interimResults = true;
    mic.classList.add("rec");
    rec.onresult = (e) => { $("#q").value = [...e.results].map((r) => r[0].transcript).join(""); };
    rec.onend = () => { mic.classList.remove("rec"); rec = null; if ($("#q").value.trim()) send($("#q").value); };
    rec.start();
  };
}

function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; $("#screen").appendChild(d); setTimeout(() => d.remove(), 2600); }

// ======================= under the hood =======================
function hoodClear(text) { $("#hood-trace").innerHTML = `<div class="ev st">${USER_ID} → <b>${esc(text)}</b></div>`; }
function hoodEvent(e) {
  const t = $("#hood-trace");
  const div = document.createElement("div");
  if (e.type === "status") { div.className = "ev st"; div.textContent = "⋯ agent: " + e.text; }
  else if (e.type === "thinking") { div.className = "ev st"; div.style.color = "#a9c7dc"; div.textContent = "💭 " + e.text; }
  else if (e.type === "tool") { div.className = "ev"; div.innerHTML = `<b>${esc(e.tool)}</b>(${esc(JSON.stringify(e.args))})\n→ ${esc(JSON.stringify(e.result).slice(0, 420))}`; }
  else if (e.type === "payment") { div.className = "ev pay"; div.innerHTML = `<b>payment intent</b> ${esc(e.payment.id)} · ${money(e.payment.total)} · <span class="s-await">awaiting_user_confirmation</span>`; }
  else if (e.type === "reply") { div.className = "ev st"; div.textContent = "reply: " + e.text; }
  else if (e.type === "error") { div.className = "ev"; div.style.borderColor = "#f04"; div.textContent = "error: " + e.text; }
  else return;
  t.appendChild(div);
  t.parentElement.scrollTop = t.parentElement.scrollHeight;
}
async function refreshHood() {
  const s = await fetch(`/debug/${TENANT}`).then((r) => r.json());
  $("#hood-agent").innerHTML = `${s.mode === "gemini" ? `Gemini <b style="color:#fff">${esc(s.model)}</b>` : `<b style="color:#ffc24b">MOCK</b> (no GEMINI_API_KEY)`} · function calling · per-tenant memory`;
  const u = Object.entries(s.memory);
  $("#hood-mem").innerHTML = u.length ? u.map(([id, m]) => `<div><b style="color:#fff">${esc(id)}</b> · ${m.history.length} messages<br>${m.preferences.map((p) => `<span class="tag">${esc(p)}</span>`).join("") || '<span style="color:#7a8a9a">no saved preferences</span>'}</div>`).join("") : '<span style="color:#7a8a9a">empty</span>';
  $("#hood-pay").innerHTML = s.payments.length ? s.payments.slice(-4).reverse().map((p) => `<div style="margin-bottom:6px">${esc(p.id)} · ${money(p.total)} · ${p.history.map((h) => `<span class="s-${h.status.split("_")[0]}">${h.status}</span><span style="color:#7a8a9a">(${h.by})</span>`).join(" → ")}</div>`).join("") : '<span style="color:#7a8a9a">none</span>';
}
$("#reset").onclick = async () => { await fetch(`/debug/${TENANT}/reset`, { method: "POST" }); location.reload(); };
$("#hoodtoggle").onclick = () => { $("#hood").classList.toggle("off"); $("#hoodtoggle").textContent = $("#hood").classList.contains("off") ? "Show under the hood" : "Hide under the hood"; };

// ======================= boot =======================
(async () => {
  S.data = await fetch(`/demo-data/${TENANT}`).then((r) => r.json());
  agent = AgentPay.init({ key: "pk_biblusi_demo", userId: USER_ID, location: S.data.location });
  AgentPayUI.lang = LANG;
  $("#fab").onclick = () => openChat();
  render();
  refreshHood();
  if (new URLSearchParams(location.search).has("clean")) { $("#hood").classList.add("off"); $("#hoodtoggle").textContent = "Show under the hood"; }
})();
</script>
