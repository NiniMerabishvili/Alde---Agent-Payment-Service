<!doctype html>
<!-- PROTOTYPE — throwaway investor demo. A Wizz Air look-alike host app with the AgentPay agent built in via /sdk.js.
     TEST CASE: "book a seat on Oct 21 and return on 27 Oct"  (→ KUT ⇄ BER round trip, Wed 21 Oct / Tue 27 Oct 2026, ₾918.00)
     Also: "Book a one-way flight from Kutaisi to Budapest this Friday with a 20kg checked bag"
     Everything Wizz-specific (search, results, bags, passenger, boarding pass) is "the client's app"; the agent + payments come from our API. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wizz Air — AI booking demo</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
<link rel="icon" type="image/png" href="/favicon.png?v=2" sizes="64x64" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink: #c6007e; --pink-dark: #a30068; --pink-08: rgba(198,0,126,.08); --pink-16: rgba(198,0,126,.16);
    --navy: #06038d; --navy-deep: #050243; --navy-08: rgba(6,3,141,.07);
    --text: #06038d; --body: #1b1a3a; --muted: rgba(27,26,58,.6); --faint: rgba(27,26,58,.38); --line: rgba(6,3,141,.1);
    --surface: #f2f2f6; --green: #0fa968; --radius: 14px;
    font-family: Quicksand, -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #e9e8f3; color: var(--body); min-height: 100vh; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 24px; font-weight: 600; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  img { display: block; }
  b, h1, h2, h3, h4 { font-weight: 700; }

  /* ---------- phone frame ---------- */
  .phone { width: 390px; height: 844px; border-radius: 54px; background: #111; padding: 11px; box-shadow: 0 30px 80px rgba(6,3,141,.25); flex-shrink: 0; position: relative; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #fff; position: relative; display: flex; flex-direction: column; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #111; border-radius: 20px; z-index: 100; }
  .statusbar { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px 34px; font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 15px; flex-shrink: 0; z-index: 40; background: var(--navy); color: #fff; transition: background .2s; }
  .statusbar.light { background: #fff; color: #000; }
  .statusbar svg * { fill: currentColor; }
  .statusbar svg rect[fill="none"] { fill: none; stroke: currentColor; }
  @media (max-width: 520px) {
    body { padding: 0; background: #fff; display: block; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; }
    .island, .statusbar, .hood { display: none !important; }
    .chat { top: 0 !important; }
  }
  .view { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
  .view::-webkit-scrollbar { display: none; }

  /* ---------- logo ---------- */
  .wlogo { font-family: Nunito, sans-serif; font-weight: 900; font-style: italic; font-size: 30px; letter-spacing: -1.5px; color: #fff; line-height: 1; display: inline-flex; align-items: baseline; }
  .wlogo i { color: var(--pink); font-style: italic; }
  .wlogo small { font-size: 11px; font-style: normal; letter-spacing: .5px; margin-left: 6px; font-family: Quicksand; font-weight: 700; opacity: .8; }

  /* ---------- home ---------- */
  .hhead { background: linear-gradient(180deg, var(--navy) 0%, #0b078f 70%, #1a0f99 100%); color: #fff; padding: 6px 18px 70px; position: relative; overflow: hidden; }
  .hhead::after { content: ""; position: absolute; right: -60px; top: 20px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(198,0,126,.55), rgba(198,0,126,0) 70%); }
  .hhead .top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
  .hhead .bell { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; }
  .hhead h1 { font-size: 24px; margin-top: 18px; position: relative; z-index: 1; line-height: 1.2; }
  .hhead p { opacity: .8; font-size: 14px; margin-top: 4px; position: relative; z-index: 1; }
  .sform { margin: -54px 14px 16px; background: #fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(6,3,141,.16); padding: 14px; position: relative; z-index: 2; }
  .seg { display: flex; background: var(--surface); border-radius: 99px; padding: 4px; margin-bottom: 12px; }
  .seg button { flex: 1; text-align: center; padding: 8px; border-radius: 99px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
  .seg .on { background: var(--navy); color: #fff; }
  .fld { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; width: 100%; text-align: left; margin-bottom: 8px; position: relative; }
  .fld .ic { color: var(--pink); flex-shrink: 0; display: grid; place-items: center; }
  .fld small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .fld b { font-size: 16px; color: var(--navy); }
  .fld .code { margin-left: auto; font-weight: 700; color: var(--faint); font-size: 14px; }
  .fld .near { font-size: 10.5px; background: var(--pink-08); color: var(--pink); padding: 2px 7px; border-radius: 99px; margin-left: 6px; font-weight: 700; vertical-align: 2px; }
  .swap { position: absolute; right: 26px; top: 108px; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--navy); z-index: 3; }
  .frow { display: flex; gap: 8px; }
  .frow .fld { flex: 1; }
  .btn { background: var(--pink); color: #fff; border-radius: 99px; padding: 15px 16px; font-weight: 700; font-size: 16px; flex: 1; display: flex; justify-content: center; gap: 8px; width: 100%; box-shadow: 0 6px 16px rgba(198,0,126,.28); }
  .btn:disabled { opacity: .5; }
  .btn.sec2 { background: var(--pink-08); color: var(--pink); box-shadow: none; }
  .btn.navy { background: var(--navy); box-shadow: none; }
  .aibanner { margin: 0 14px 20px; border-radius: 16px; padding: 16px; color: #fff; background: linear-gradient(120deg, #c6007e 0%, #7a0a8f 55%, #06038d 100%); position: relative; overflow: hidden; display: block; width: calc(100% - 28px); text-align: left; }
  .aibanner h3 { font-size: 18px; line-height: 1.2; margin-bottom: 4px; max-width: 250px; }
  .aibanner p { font-size: 13px; opacity: .92; max-width: 245px; }
  .aibanner .cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: #fff; color: var(--pink); padding: 7px 13px; border-radius: 99px; font-weight: 700; font-size: 13px; }
  .aibanner .spark { position: absolute; right: 10px; top: 4px; font-size: 80px; opacity: .2; }
  .sec { display: flex; justify-content: space-between; align-items: baseline; padding: 0 16px 10px; }
  .sec h2 { font-size: 19px; color: var(--navy); }
  .sec a { color: var(--pink); font-weight: 700; font-size: 13.5px; }
  .carousel { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 22px; scrollbar-width: none; }
  .dcard { width: 170px; flex-shrink: 0; text-align: left; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 3px 12px rgba(6,3,141,.1); }
  .dimg { height: 110px; background: linear-gradient(135deg, #06038d, #c6007e); position: relative; display: grid; place-items: center; color: #fff; font-size: 34px; font-family: Nunito; font-weight: 900; }
  .dimg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dcard .t { padding: 8px 10px 10px; }
  .dcard b { color: var(--navy); font-size: 15px; display: block; }
  .dcard small { color: var(--muted); font-size: 12px; display: block; }
  .dcard .from { color: var(--pink); font-weight: 700; font-size: 14px; margin-top: 4px; }
  .airports { padding: 0 16px 120px; display: flex; flex-direction: column; gap: 8px; }
  .aprow { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface); text-align: left; width: 100%; }
  .aprow .code { width: 48px; height: 48px; border-radius: 12px; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .aprow b { color: var(--navy); display: block; }
  .aprow small { color: var(--muted); font-size: 12.5px; }
  .aprow .km { margin-left: auto; white-space: nowrap; color: var(--pink); font-weight: 700; font-size: 13px; }

  /* ---------- nav + fab ---------- */
  .nav { display: flex; justify-content: space-around; border-top: 1px solid var(--line); background: #fff; padding: 8px 0 22px; flex-shrink: 0; }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--faint); width: 76px; }
  .nav button.on { color: var(--pink); }
  .nav svg { width: 24px; height: 24px; }
  .fab { position: absolute; right: 16px; bottom: 96px; z-index: 20; background: var(--pink); color: #fff; border-radius: 99px; padding: 13px 18px 13px 15px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px rgba(198,0,126,.45); }
  .fab.hide { display: none; }

  /* ---------- results ---------- */
  .rhead { background: var(--navy); color: #fff; padding: 4px 14px 14px; position: sticky; top: 0; z-index: 5; }
  .rhead .r1 { display: flex; align-items: center; gap: 10px; }
  .rhead .route { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .rhead .sub { font-size: 12.5px; opacity: .75; margin-left: 34px; }
  .circle { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; color: #fff; }
  .circle.l { background: #fff; color: var(--navy); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .days { display: flex; gap: 6px; overflow-x: auto; padding: 12px 14px; scrollbar-width: none; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 66px; z-index: 4; }
  .day { flex-shrink: 0; width: 64px; padding: 8px 4px; border-radius: 12px; text-align: center; border: 1.5px solid var(--line); }
  .day small { display: block; font-size: 11px; color: var(--muted); }
  .day b { display: block; font-size: 14px; color: var(--navy); }
  .day span { font-size: 11.5px; color: var(--pink); font-weight: 700; }
  .day.none span { color: var(--faint); }
  .day.on { background: var(--navy); border-color: var(--navy); }
  .day.on small, .day.on b, .day.on span { color: #fff; }
  .flist { padding: 14px 14px 120px; display: flex; flex-direction: column; gap: 12px; }
  .fcard { border-radius: 16px; background: #fff; box-shadow: 0 3px 14px rgba(6,3,141,.1); border: 1.5px solid transparent; text-align: left; width: 100%; overflow: hidden; }
  .fcard.sel { border-color: var(--pink); }
  .fcard .ft { display: flex; align-items: center; padding: 14px 14px 10px; gap: 8px; }
  .fcard .tm { font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1; }
  .fcard .ap { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 3px; }
  .fcard .mid { flex: 1; text-align: center; font-size: 11.5px; color: var(--muted); }
  .fcard .mid .ln { height: 2px; background: var(--line); margin: 5px 4px; position: relative; }
  .fcard .mid .ln::after { content: "✈"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); color: var(--pink); background: #fff; padding: 0 4px; font-size: 13px; }
  .fcard .fb { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface); font-size: 12.5px; color: var(--muted); }
  .fcard .pr { color: var(--pink); font-weight: 700; font-size: 19px; }
  .fcard .pr small { font-size: 11px; color: var(--muted); font-weight: 600; display: block; text-align: right; }
  .left { color: #d14; font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }

  /* ---------- sheets ---------- */
  .scrim { position: absolute; inset: 0; background: rgba(5,2,67,.45); z-index: 60; display: flex; align-items: flex-end; animation: fade .2s; }
  .sheet { background: #fff; width: 100%; border-radius: 22px 22px 0 0; max-height: 90%; display: flex; flex-direction: column; animation: up .25s ease-out; }
  .sheet .body { overflow-y: auto; flex: 1; scrollbar-width: none; padding-bottom: 6px; }
  .grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 8px auto 4px; }
  @keyframes up { from { transform: translateY(40%); opacity: .4; } }
  @keyframes fade { from { opacity: 0; } }
  .shead { padding: 8px 16px 6px; }
  .shead h2 { font-size: 20px; color: var(--navy); }
  .shead p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .bundles { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; }
  .bundle { flex: 1; min-width: 104px; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; text-align: left; }
  .bundle b { color: var(--navy); font-size: 14px; display: block; }
  .bundle small { color: var(--muted); font-size: 11px; display: block; line-height: 1.35; margin: 4px 0 6px; }
  .bundle span { color: var(--pink); font-weight: 700; font-size: 13.5px; }
  .bundle.on { border-color: var(--pink); background: var(--pink-08); }
  .og { padding: 4px 16px 6px; }
  .og h4 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 2px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 8px; font-weight: 700; font-size: 14.5px; width: 100%; text-align: left; color: var(--navy); }
  .opt .oi { font-size: 22px; width: 30px; text-align: center; }
  .opt small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
  .box { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; flex-shrink: 0; margin-left: auto; }
  .opt.on { border-color: var(--pink); background: var(--pink-08); }
  .opt.on .box { background: var(--pink); border-color: var(--pink); }
  .opt.on .box::after { content: ""; width: 10px; height: 6px; border: 2.5px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
  .opt .x { color: var(--pink); font-size: 14px; white-space: nowrap; }
  .sheetfoot { display: flex; gap: 12px; padding: 12px 16px 26px; border-top: 1px solid var(--line); align-items: center; }
  .stepper { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 16px; color: var(--navy); }
  .stepper button { color: var(--pink); font-size: 22px; width: 22px; line-height: 1; }
  .pick { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .pick b { color: var(--navy); }
  .pick small { color: var(--muted); font-size: 12.5px; display: block; }
  .pick .code { margin-left: auto; font-weight: 700; color: var(--pink); }

  /* ---------- checkout ---------- */
  .pagehead { display: flex; align-items: center; gap: 12px; padding: 6px 14px 14px; position: sticky; top: 0; background: var(--navy); color: #fff; z-index: 5; }
  .pagehead h1 { font-size: 18px; }
  .pagehead .vsub { font-size: 12.5px; opacity: .75; }
  .progress { display: flex; gap: 4px; padding: 12px 16px 4px; }
  .progress i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
  .progress i.done { background: var(--pink); }
  .block { padding: 14px 16px 4px; }
  .block h3 { font-size: 17px; margin-bottom: 10px; color: var(--navy); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border-radius: 12px; font-weight: 700; font-size: 14.5px; margin-bottom: 8px; color: var(--navy); }
  .row .ic { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
  .row small { display: block; color: var(--muted); font-weight: 600; font-size: 12.5px; }
  .row .chev { margin-left: auto; color: var(--faint); }
  .line { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .line img, .line .ph { width: 52px; height: 42px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .line .ph { background: linear-gradient(135deg, #06038d, #c6007e); display: grid; place-items: center; color: #fff; font-size: 16px; }
  .line .q { color: var(--pink); font-weight: 700; min-width: 22px; }
  .line .nm { flex: 1; font-weight: 700; font-size: 14px; color: var(--navy); }
  .line .mods { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .line .pr { font-weight: 700; font-size: 14px; color: var(--navy); white-space: nowrap; }
  .sum { display: flex; justify-content: space-between; font-weight: 600; color: var(--muted); font-size: 14px; padding: 3px 0; }
  .sum.total { color: var(--navy); font-weight: 700; font-size: 17px; padding-top: 8px; }
  .mc { width: 30px; height: 20px; border-radius: 4px; background: #1b1a3a; position: relative; flex-shrink: 0; display: inline-block; }
  .mc::before, .mc::after { content: ""; position: absolute; top: 4px; width: 12px; height: 12px; border-radius: 50%; }
  .mc::before { left: 5px; background: #eb001b; } .mc::after { left: 12px; background: rgba(247,158,27,.9); }

  /* ---------- boarding pass ---------- */
  .confirm { background: linear-gradient(180deg, var(--navy) 0, var(--navy) 230px, var(--surface) 230px); min-height: 100%; padding: 6px 16px 40px; }
  .confirm .ok { color: #fff; text-align: center; padding: 6px 0 16px; }
  .confirm .ok .tick { width: 54px; height: 54px; border-radius: 50%; background: var(--pink); display: grid; place-items: center; margin: 0 auto 8px; }
  .confirm .ok h1 { font-size: 21px; }
  .confirm .ok p { opacity: .8; font-size: 13px; }
  .bp { background: #fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(6,3,141,.18); overflow: hidden; }
  .bp .bh { background: var(--pink); color: #fff; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
  .bp .bh .wlogo { font-size: 22px; }
  .bp .bh .wlogo i { color: #fff; opacity: .8; }
  .bp .rt { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 6px; }
  .bp .rt .c { font-size: 32px; font-weight: 700; color: var(--navy); line-height: 1; }
  .bp .rt small { color: var(--muted); font-size: 12px; display: block; }
  .bp .rt .pl { color: var(--pink); font-size: 22px; }
  .bp .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 10px 16px 14px; }
  .bp .grid small { display: block; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
  .bp .grid b { color: var(--navy); font-size: 14.5px; }
  .bp .tear { border-top: 2px dashed var(--line); margin: 0 14px; position: relative; }
  .bp .tear::before, .bp .tear::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); }
  .bp .tear::before { left: -26px; } .bp .tear::after { right: -26px; }
  .bp .qr { display: flex; gap: 14px; align-items: center; padding: 16px; }
  .bp .qr svg { width: 118px; height: 118px; flex-shrink: 0; }
  .bp .qr small { color: var(--muted); font-size: 12px; display: block; }
  .bp .qr b { color: var(--navy); }
  .agentpaid { display: flex; gap: 10px; align-items: center; background: var(--pink-08); border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 13px; color: var(--pink-dark); margin: 14px 0; }

  /* ---------- issuing (fulfilment) ---------- */
  .ihero { background: linear-gradient(180deg, var(--navy), #1a0f99); color: #fff; padding: 2px 14px 14px; border-radius: 0 0 24px 24px; position: sticky; top: 0; z-index: 5; box-shadow: 0 6px 18px rgba(6,3,141,.18); }
  .ihero .r1 { display: flex; justify-content: space-between; align-items: center; }
  .iart { position: relative; width: 360px; height: 150px; margin: -14px auto -6px; }
  .iart svg { position: absolute; inset: 0; }
  .iplane { position: absolute; left: 0; top: 0; offset-distance: 0%; offset-rotate: auto; color: #fff; font-size: 22px; line-height: 1; width: 22px; height: 22px; margin: -11px 0 0 -11px; text-shadow: 0 0 12px rgba(198,0,126,.9); animation: bob 1.4s ease-in-out infinite; }
  .iplane.fly { animation: flyroute 9s cubic-bezier(.45,.05,.55,.95) forwards; }
  @keyframes flyroute { to { offset-distance: 100%; } }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  .ibig { font-size: 22px; font-weight: 700; text-align: center; margin-top: 2px; }
  .isub { font-size: 13px; opacity: .8; text-align: center; margin-top: 2px; min-height: 18px; }
  .ipnrrow { display: flex; justify-content: center; gap: 8px; align-items: baseline; margin-top: 10px; font-size: 12px; opacity: .9; }
  .ipnrrow b { font-size: 18px; letter-spacing: .14em; background: rgba(255,255,255,.12); padding: 3px 10px; border-radius: 8px; }
  #istages .apui-st small { white-space: pre-line; }

function pnrFor(id) { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let k = 0; k < 6; k++) { s += A[h % A.length]; h = Math.floor(h / A.length) + k * 7919; } return s; }
function qrSvg(seed) {
  const N = 25; let h = 0; for (const c of seed) h = (h * 131 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#06038d"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#06038d"/>`;
  const inF = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  let cells = ""; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inF(x, y) && rnd() > 0.52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return `<svg viewBox="-1 -1 ${N + 2} ${N + 2}" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${N + 2}" height="${N + 2}" fill="#fff"/><g fill="#06038d">${cells}</g>${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg>`;
}

let chatLog = [];
const scrollChat = () => { const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight; };
function bubble(cls, text) { const b = document.createElement("div"); b.className = "b " + cls; b.textContent = text; $("#msgs").appendChild(b); scrollChat(); return b; }

async function send(text) {
  text = text.trim();
  if (!text || S.busy) return;
  S.busy = true;
  $("#q").value = "";
  if (/[Ⴀ-ჿ]/.test(text) !== ka()) { LANG = ka() ? "en" : "ka"; localStorage.setItem("agentpay_lang", LANG); AgentPayUI.lang = LANG; document.querySelectorAll(".langsw button").forEach((b, k) => b.classList.toggle("on", (k === 1) === ka())); }
  $(".welcome")?.remove();
  bubble("me", text);
  const tb = AgentPayUI.thinking($("#msgs"), { accent: "#c6007e", onUpdate: scrollChat });
  const replyHolder = document.createElement("div");
  replyHolder.style.display = "contents";
  $("#msgs").appendChild(replyHolder);
  hoodClear(text);
  await agent.send(text, (e) => {
    hoodEvent(e);
    if (e.type === "status") tb.status(e.text);
    if (e.type === "thinking") tb.thought(e.text);
    if (e.type === "tool") tb.step(e.label, !e.result?.error);
    if (e.type === "payment") tb.settled().then(() => orderCard(e.payment));
    if (e.type === "reply" && e.text) tb.settled().then(() => { const b = document.createElement("div"); b.className = "b ai"; b.textContent = e.text; replyHolder.appendChild(b); scrollChat(); });
    if (e.type === "error") tb.settled().then(() => bubble("ai", "⚠ " + e.text));
    if (e.type === "done") tb.done();
  }).catch(() => { tb.done(); bubble("ai", t().conn); });
  await tb.settled();
  S.busy = false;
  refreshHood();
}

  const m = item(p.lines[0].itemId).meta;

  card.innerHTML = `
    <div class="vh">
      ${legs(m).map((g, k) => `${k ? '<div style="height:1px;background:rgba(255,255,255,.18);margin:10px 0"></div>' : ""}
      ${g.label ? `<div class="meta" style="margin:0 0 6px"><span><b style="color:#ff6fc4">${legLabel(g).toUpperCase()}</b> · ${esc(fd(g.date))} · ${esc(g.flightNo)}</span>${g.price ? `<span>${money(g.price)}</span>` : ""}</div>` : ""}
      <div class="rt"><div class="c">${g.dep}<small>${esc(cFrom(g))} ${g.from}</small></div><div class="mid">${fdur(g.durationMin)}<div class="ln"></div>${t().direct}</div><div class="c" style="text-align:right">${g.arr}<small>${esc(cTo(g))} ${g.to}</small></div></div>`).join("")}
      <div class="meta"><span>${m.roundTrip ? "" : `${esc(fd(m.date))} · ${esc(m.flightNo)}`}</span><span>${t().nearest(esc(p.venue.area), km(S.data.location, venue(p.venue.id)).toFixed(0))}</span></div>
    </div>
    <div class="ls">${p.lines.map((l) => `<div class="line"><span class="q">${l.qty}×</span><div class="nm">${t().adult(l.qty)} · ${t().fare(item(l.itemId).meta.roundTrip)}<div class="mods">${l.options.length ? "+ " + esc(lopts(l).join(", ")) : t().basic}</div></div><span class="pr">${money(l.qty * l.unitPrice)}</span></div>`).join("")}</div>
    <div class="sums">
      <div class="sum"><span>${t().extras}</span><span>${money(p.subtotal)}</span></div>
      <div class="sum"><span>${t().admin}</span><span>${p.serviceFee ? money(p.serviceFee) : t().included}</span></div>
      <div class="sum total"><span>${t().total}</span><span>${money(p.total)}</span></div>
    </div>
    <div class="pm"><span class="mc"></span>${esc(p.paymentMethod)}<span style="margin-left:auto;color:var(--pink)">${t().change}</span></div>
    <div class="acts">
      <button class="btn pay">${t().pay} ${money(p.total)}</button>
      <button class="btn sec2 edit">${t().review}</button>
      <div class="note">${t().safe}</div>
    </div>`;
  card.querySelector(".pay").onclick = async (ev) => {
    ev.target.disabled = true;
    const paid = await payWithFaceId(p);
    if (!paid) { ev.target.disabled = false; return; }
    card.classList.add("paid");
    card.querySelector(".acts").innerHTML = `<div class="paidrow">${t().paidRow(money(paid.total))}</div>`;
    bubble("ai", t().done(m));
    setTimeout(() => startIssuing(paid, true), 1400);
  };
  card.querySelector(".edit").onclick = () => { closeChat(); go("checkout"); };
  $("#msgs").appendChild(card);
  scrollChat();
}

function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("#mic");
  if (!SR) { mic.style.display = "none"; return; }
  let rec;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = ka() ? "ka-GE" : "en-US"; rec.interimResults = true;
    mic.classList.add("rec");
    rec.onresult = (e) => { $("#q").value = [...e.results].map((r) => r[0].transcript).join(""); };
    rec.onend = () => { mic.classList.remove("rec"); rec = null; if ($("#q").value.trim()) send($("#q").value); };
    rec.start();
  };
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; $("#screen").appendChild(d); setTimeout(() => d.remove(), 3200); }

// ======================= under the hood =======================
function hoodClear(text) { $("#hood-trace").innerHTML = `<div class="ev st">${USER_ID} → <b>${esc(text)}</b></div>`; }
function hoodEvent(e) {
  const t = $("#hood-trace");
  const div = document.createElement("div");
  if (e.type === "status") { div.className = "ev st"; div.textContent = "⋯ agent: " + e.text; }
  else if (e.type === "thinking") { div.className = "ev st"; div.style.color = "#a9c7dc"; div.textContent = "💭 " + e.text; }
  else if (e.type === "tool") { div.className = "ev"; div.innerHTML = `<b>${esc(e.tool)}</b>(${esc(JSON.stringify(e.args))})\n→ ${esc(JSON.stringify(e.result).slice(0, 420))}`; }
  else if (e.type === "payment") { div.className = "ev pay"; div.innerHTML = `<b>payment intent</b> ${esc(e.payment.id)} · ${money(e.payment.total)} · <span class="s-await">awaiting_user_confirmation</span>`; }
  else if (e.type === "reply") { div.className = "ev st"; div.textContent = "reply: " + e.text; }
  else if (e.type === "error") { div.className = "ev"; div.style.borderColor = "#f04"; div.textContent = "error: " + e.text; }
  else return;
  t.appendChild(div);
  t.parentElement.scrollTop = t.parentElement.scrollHeight;
}
async function refreshHood() {
  const s = await fetch(`/debug/${TENANT}`).then((r) => r.json());
  $("#hood-agent").innerHTML = `${s.mode === "gemini" ? `Gemini <b style="color:#fff">${esc(s.model)}</b>` : `<b style="color:#ffc24b">MOCK</b> (no GEMINI_API_KEY)`} · function calling · per-tenant memory`;
  const u = Object.entries(s.memory);
  $("#hood-mem").innerHTML = u.length ? u.map(([id, m]) => `<div><b style="color:#fff">${esc(id)}</b> · ${m.history.length} messages<br>${m.preferences.map((p) => `<span class="tag">${esc(p)}</span>`).join("") || '<span style="color:#7a8a9a">no saved preferences</span>'}</div>`).join("") : '<span style="color:#7a8a9a">empty</span>';
  $("#hood-pay").innerHTML = s.payments.length ? s.payments.slice(-4).reverse().map((p) => `<div style="margin-bottom:6px">${esc(p.id)} · ${money(p.total)} · ${p.history.map((h) => `<span class="s-${h.status.split("_")[0]}">${h.status}</span><span style="color:#7a8a9a">(${h.by})</span>`).join(" → ")}</div>`).join("") : '<span style="color:#7a8a9a">none</span>';
}
$("#reset").onclick = async () => { await fetch(`/debug/${TENANT}/reset`, { method: "POST" }); location.reload(); };
$("#hoodtoggle").onclick = () => { $("#hood").classList.toggle("off"); $("#hoodtoggle").textContent = $("#hood").classList.contains("off") ? "Show under the hood" : "Hide under the hood"; };

// ======================= boot =======================
(async () => {
  S.data = await fetch(`/demo-data/${TENANT}`).then((r) => r.json());
  AgentPayUI.lang = LANG;
  agent = AgentPay.init({ key: "pk_wizzair_demo", userId: USER_ID, location: S.data.location });
  S.search.from = nearest()[0].meta.code;
  $("#fab").onclick = () => openChat();
  renderNav();
  render();
  refreshHood();
  if (new URLSearchParams(location.search).has("clean")) { $("#hood").classList.add("off"); $("#hoodtoggle").textContent = "Show under the hood"; }
})();
</script>
